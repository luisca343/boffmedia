[package]
name = "boff-launcher"
version = "0.0.2"
description = "Boff Launcher"
authors = ["Boffmedia"]
edition = "2021"
# portablemc 5.0.4 is edition 2024 and declares rust-version 1.88.0, so the
# previous 1.77.2 here was already unachievable — cargo would have refused the
# dependency long before anything in this crate mattered. This crate's own
# sources stay on edition 2021; only the toolchain floor moves.
rust-version = "1.88.0"

[lib]
# Tauri v2 keeps the app in a lib so mobile targets and integration tests can
# reach it; main.rs is a thin shim over run().
name = "boff_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Codegen for the pack manifest: JSON Schema (emitted from zod) -> Rust structs.
typify = "0.2"
schemars = "0.8"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
# icons.rs hands catalog art to the renderer as data: URLs — the asset protocol
# (and its scope, which never matched the custom data root) is gone on purpose.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ── Required by the code typify generates in build.rs ──────────────────────
# typify emits references to these but does NOT add them for you; they are its
# own dev-dependencies precisely because that is what compiling generated code
# needs. Versions track typify 0.2's:
#   `pattern`          -> regress   (0.10 API — NOT 0.11, which changed it)
#   `format: uuid`     -> uuid
#   `format: date-time`-> chrono
# Removing a `.regex()`, `z.uuid()` or `z.iso.datetime()` from the zod schema
# would make the matching crate unused here, not the other way round.
regress = "0.10"
# `v4` is not typify's doing: §6 needs a unique name for each partial download
# in the content-addressed cache (install/files.rs).
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
# HANDOFF §5/§6: msa auth, Forge AND NeoForge install, Java management.
# The `forge` module's Loader enum selects Forge vs NeoForge.
portablemc = "5.0"
# §5.7 — the refresh token goes in the OS credential store, never a file.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# §5's auth chain is hand-rolled (portablemc::msa cannot surface the refresh
# token for the keychain), so the launcher makes these calls itself.
reqwest = { version = "0.12", features = ["json"] }
# "net" + "io-util": the hand-rolled SLP client (status.rs) opens a raw
# TcpStream and writes/reads varints over it directly, no HTTP involved.
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
# Packs locales: export_mrpack/import_mrpack read and write the .mrpack zip
# container (local_packs.rs).
zip = "2"
# worlds.rs: level.dat is gzipped NBT. Already in the tree via `zip`; named here
# because this crate uses GzDecoder directly.
flate2 = "1"
# RF-06/RF-07 file pickers (export destination, import source). No dialog
# plugin existed before this feature.
tauri-plugin-dialog = "2"
# §6 file verification. portablemc's downloader only checks sha1, but every file
# in a Boffmedia manifest carries a mandatory sha512 (packages/pack-schema), so
# the pack payload is downloaded and verified by install/files.rs instead.
sha2 = "0.10"
# §5.1 — the device-code page must open in the SYSTEM browser. A narrow command
# using this beats tauri-plugin-opener, whose purpose is handing the RENDERER a
# general opener; see `auth::auth_open_verification`.
open = "5"
# Auto-update. Not gated behind a desktop `cfg`: this launcher only ever targets
# Windows/macOS/Linux, and a target table here would make `updates.rs` fail to
# compile for a mobile target that will never be built anyway.
tauri-plugin-updater = "2"
# A second launch must never start a second game-managing process: two instances
# would race on the same instance dir, the same marker file and the same
# credential entry. This one focuses the window that is already open instead.
tauri-plugin-single-instance = "2"

# §9's memory heuristic needs one number: total physical RAM. Both crates were
# ALREADY in Cargo.lock as transitive dependencies of tauri, so neither adds a
# package to the build — which is why `sysinfo` was not reached for: it would
# pull a whole process/disk/network enumerator in for a single sysconf call.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[features]
# Enabled by `tauri build --debug`.
default = []
