<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Daño — BoffMedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family:"Mystery Dungeon"; src:url("fonts/PKMN-Mystery-Dungeon.ttf") format("truetype"); font-display:swap; }
@font-face { font-family:"Arcade Classic"; src:url("fonts/arcadeclassic.ttf") format("truetype"); font-display:swap; }

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body {
  background: rgb(3,5,15);
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: rgb(226,232,240);
  font-size: 13px;
}
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background: rgb(12,18,32); }
::-webkit-scrollbar-thumb { background: rgb(51,65,85); border-radius:3px; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
input[type=range] { -webkit-appearance:none; height:3px; border-radius:2px; background:rgba(51,65,85,0.8); cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:rgb(249,115,22); cursor:pointer; }

/* ── Layout ── */
.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.main-grid { flex:1; min-height:0; overflow:hidden; }
.matrix-layout { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.matrix-body { flex:1; min-height:0; overflow:hidden; display:grid; }
.poke-panel { height:100%; }
.field-panel { height:100%; }

/* Nav */
.nav {
  position:sticky; top:0; z-index:200;
  height:56px; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px;
  background: rgba(12,18,32,0.97);
  border-bottom: 1px solid rgba(51,65,85,0.7);
  backdrop-filter: blur(12px);
  box-shadow: 0 2px 20px rgba(0,0,0,0.6);
}
.nav-logo { display:flex; align-items:center; gap:8px; cursor:pointer; }
.nav-logo-text {
  font-family:'Orbitron',sans-serif; font-size:17px; font-weight:900;
  background:linear-gradient(90deg,rgb(251,146,60),rgb(249,115,22));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.nav-beta {
  font-size:8px; font-weight:800;
  background:linear-gradient(90deg,rgb(253,224,71),rgb(251,146,60));
  color:rgb(120,53,15); padding:2px 5px; border-radius:9999px; margin-top:-8px;
}
.nav-tool {
  display:flex; align-items:center; gap:6px;
  background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.25);
  border-radius:8px; padding:5px 12px;
  font-size:12px; font-weight:600; color:rgb(251,146,60);
}
.nav-right { display:flex; align-items:center; gap:10px; }
.nav-avatar {
  width:30px; height:30px; border-radius:50%;
  background:linear-gradient(135deg,rgb(249,115,22),rgb(234,88,12));
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:white; cursor:pointer;
}

/* ── Move Strip (top) ── */
.move-strip {
  background: rgba(12,18,32,0.97);
  border-bottom: 1px solid rgba(51,65,85,0.5);
}

/* Top row: poke info + moves */
.move-strip-top {
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
  gap: 0;
}
.move-strip-divider {
  background: rgba(51,65,85,0.5);
  width: 1px;
  align-self: stretch;
}

/* Each half */
.move-half {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0;
  padding: 8px 10px;
  align-items: start;
}
.move-half.right {
  grid-template-columns: 1fr auto;
  direction: ltr;
}

/* Poke summary (sprite + name + HP + roll level) */
.move-poke-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-right: 10px;
  min-width: 140px;
  max-width: 160px;
}
.move-half.right .move-poke-info {
  padding-right: 0;
  padding-left: 10px;
  align-items: flex-end;
}

.move-poke-header {
  display: flex;
  align-items: center;
  gap: 6px;
}
.move-half.right .move-poke-header {
  flex-direction: row-reverse;
}
.move-poke-name {
  font-size: 13px; font-weight: 800; color: rgb(226,232,240);
  font-family: 'Inter', sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.move-poke-lvl {
  font-size: 10px; color: rgb(100,116,139); font-weight: 600;
}
.move-poke-sprite {
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
}

/* Mini HP bar in strip */
.strip-hp-wrap {
  display: flex; flex-direction: column; gap: 2px;
}
.strip-hp-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; font-family: 'Roboto Mono', monospace;
}
.strip-hp-track {
  flex: 1; height: 5px; background: rgba(3,5,15,0.8);
  border-radius: 3px; overflow: hidden; border: 1px solid rgba(51,65,85,0.4);
  min-width: 60px;
}
.strip-hp-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

/* Roll level pills in strip */
.strip-roll-row {
  display: flex; align-items: center; gap: 4px;
}
.strip-roll-label {
  font-size: 9px; font-weight: 700; color: rgb(71,85,105);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.strip-roll-pill {
  font-size: 9px; font-weight: 700; padding: 2px 6px;
  border-radius: 4px; border: 1px solid rgba(51,65,85,0.6);
  background: rgba(30,41,59,0.7); color: rgb(100,116,139);
  cursor: pointer; transition: all 0.12s;
}
.strip-roll-pill.active {
  background: rgba(249,115,22,0.2); border-color: rgba(249,115,22,0.5); color: rgb(251,146,60);
}

/* Move list */
.move-list { display: flex; flex-direction: column; gap: 0; flex: 1; }
.move-row {
  display: grid; grid-template-columns: 1fr auto auto;
  align-items: center; gap: 0;
  border: 1px solid rgba(51,65,85,0.4);
  border-top: none; cursor: pointer;
  transition: background 0.1s;
  min-height: 26px;
}
.move-row:first-child { border-top: 1px solid rgba(51,65,85,0.4); border-radius: 5px 5px 0 0; }
.move-row:last-child { border-radius: 0 0 5px 5px; }
.move-row:hover { background: rgba(249,115,22,0.06); }
.move-row.active {
  background: rgba(249,115,22,0.15);
  border-color: rgba(249,115,22,0.45);
  z-index: 1; position: relative;
}
.move-row-name {
  padding: 4px 8px; font-size: 11px; font-weight: 600; color: rgb(203,213,225);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.move-row.active .move-row-name { color: rgb(251,146,60); }

.move-row-range {
  padding: 4px 6px; font-size: 10px;
  font-family: 'Roboto Mono', monospace; white-space: nowrap;
  color: rgb(100,116,139);
}
.move-row-pct {
  padding: 4px 8px 4px 2px; font-size: 10px;
  font-family: 'Roboto Mono', monospace; white-space: nowrap;
  min-width: 60px; text-align: right;
}
.move-row.active .move-row-range,
.move-row.active .move-row-pct { color: rgb(251,146,60); }

/* Flip for right side — text flows right to left */
.move-half.right .move-row {
  grid-template-columns: auto auto 1fr;
}
.move-half.right .move-row-name { text-align: right; }
.move-half.right .move-row-pct { padding: 4px 2px 4px 8px; text-align: left; }

/* ── Result bar (bottom of strip) ── */
.result-bar-wrap {
  border-top: 1px solid rgba(51,65,85,0.4);
  display: grid;
  grid-template-columns: 1fr 1px 1fr;
}
.result-bar {
  padding: 5px 12px;
  display: flex; align-items: center; gap: 8px;
  min-height: 30px;
  overflow: hidden;
}
.result-bar.right { flex-direction: row-reverse; }
.result-bar-descriptor {
  font-family: 'Roboto Mono', monospace; font-size: 10px;
  color: rgb(148,163,184); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.result-bar.right .result-bar-descriptor { text-align: right; }
.result-bar-verdict {
  font-size: 10px; font-weight: 800; white-space: nowrap;
  flex-shrink: 0;
}
.result-bar-rolls {
  font-family: 'Roboto Mono', monospace; font-size: 9px;
  color: rgb(71,85,105); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.result-bar.right .result-bar-rolls { text-align: right; }

/* ── Nav tabs ── */
.nav-tabs {
  display: flex; gap: 2px; align-items: center;
  background: rgba(3,5,15,0.6); border: 1px solid rgba(51,65,85,0.5);
  border-radius: 8px; padding: 3px;
}
.nav-tab {
  padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 700;
  color: rgb(100,116,139); cursor: pointer; border: none;
  background: transparent; transition: all 0.15s; white-space: nowrap;
  letter-spacing: 0.02em;
}
.nav-tab:hover { color: rgb(203,213,225); background: rgba(51,65,85,0.4); }
.nav-tab.active {
  background: rgba(249,115,22,0.18); color: rgb(251,146,60);
  border: 1px solid rgba(249,115,22,0.35);
}

/* ── Three-column main ── */
.main-grid {
  display:grid; grid-template-columns:320px 1fr 320px;
  gap:0; flex:1;
  min-height:0;
}

/* ── Matrix view ── */
.matrix-layout {
  display: flex; flex-direction: column; flex: 1; overflow: hidden;
}
.matrix-field-bar {
  background: rgba(12,18,32,0.97);
  border-bottom: 1px solid rgba(51,65,85,0.4);
  padding: 6px 14px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.matrix-field-label {
  font-size: 10px; font-weight: 700; color: rgb(71,85,105);
  text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap;
}
.matrix-body {
  display: grid; grid-template-columns: 240px 1fr;
  flex: 1; overflow: hidden; min-height: 0;
}
.matrix-side-panel {
  background: rgba(8,12,24,0.97);
  border-right: 1px solid rgba(51,65,85,0.4);
  overflow-y: auto; padding: 10px;
  display: flex; flex-direction: column; gap: 6px;
}
.matrix-side-panel.right {
  border-right: none; border-left: 1px solid rgba(51,65,85,0.4);
}
.matrix-side-title {
  font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 800;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 5px; margin-bottom: 2px;
}
.matrix-side-title.atk {
  color: rgb(251,146,60); background: rgba(249,115,22,0.08);
  border: 1px solid rgba(249,115,22,0.2);
}
.matrix-side-title.def {
  color: rgb(192,132,252); background: rgba(168,85,247,0.08);
  border: 1px solid rgba(168,85,247,0.2);
}

/* Slot card */
.slot-card {
  display: flex; align-items: center; gap: 8px;
  background: rgba(12,18,32,0.7); border: 1px solid rgba(51,65,85,0.4);
  border-radius: 7px; padding: 6px 8px; cursor: pointer;
  transition: all 0.13s; position: relative;
}
.slot-card:hover { border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.05); }
.slot-card.empty { border-style: dashed; border-color: rgba(51,65,85,0.35); }
.slot-card.empty:hover { border-color: rgba(249,115,22,0.35); }
.slot-num {
  font-size: 9px; font-weight: 800; color: rgb(71,85,105);
  font-family: 'Roboto Mono', monospace; min-width: 14px;
}
.slot-name { font-size: 11px; font-weight: 700; color: rgb(203,213,225); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-types { display: flex; gap: 3px; }
.slot-remove {
  background: none; border: none; cursor: pointer;
  color: rgb(71,85,105); font-size: 13px; padding: 2px 4px;
  border-radius: 3px; transition: color 0.12s; line-height: 1;
}
.slot-remove:hover { color: rgb(239,68,68); }
.slot-add {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(3,5,15,0.5); border: 1px dashed rgba(51,65,85,0.4);
  border-radius: 7px; padding: 7px 8px; cursor: pointer;
  font-size: 11px; font-weight: 600; color: rgb(71,85,105);
  transition: all 0.13s;
}
.slot-add:hover { border-color: rgba(249,115,22,0.4); color: rgb(251,146,60); }

/* Matrix table area */
.matrix-table-wrap {
  flex: 1; overflow: auto; padding: 12px;
  background: rgba(3,5,15,0.95);
}
.matrix-table {
  border-collapse: collapse; width: 100%;
}
.matrix-th-corner {
  width: 160px; min-width: 160px;
  background: rgba(3,5,15,0.8);
  position: sticky; left: 0; top: 0; z-index: 3;
}
.matrix-th-col {
  min-width: 110px; padding: 6px 8px; text-align: center;
  background: rgba(8,12,24,0.97);
  border-bottom: 1px solid rgba(51,65,85,0.4);
  border-left: 1px solid rgba(51,65,85,0.25);
  position: sticky; top: 0; z-index: 2;
}
.matrix-th-col-name {
  font-size: 11px; font-weight: 700; color: rgb(203,213,225);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.matrix-th-row {
  width: 160px; min-width: 160px; padding: 6px 8px;
  background: rgba(8,12,24,0.97);
  border-right: 1px solid rgba(51,65,85,0.4);
  border-bottom: 1px solid rgba(51,65,85,0.2);
  position: sticky; left: 0; z-index: 1;
  text-align: left;
}
.matrix-th-row-name {
  font-size: 11px; font-weight: 700; color: rgb(203,213,225);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.matrix-cell {
  padding: 0; text-align: center;
  border-left: 1px solid rgba(51,65,85,0.18);
  border-bottom: 1px solid rgba(51,65,85,0.18);
  position: relative; cursor: default;
  min-width: 110px;
}
.matrix-cell-inner {
  padding: 6px 8px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
  min-height: 48px;
}
.matrix-cell-pct {
  font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700;
  white-space: nowrap;
}
.matrix-cell-move {
  font-size: 9px; color: rgb(71,85,105); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100px;
}
.matrix-cell-ko {
  font-size: 8px; font-weight: 800; letter-spacing: 0.06em;
  padding: 1px 5px; border-radius: 3px; margin-top: 1px;
}

/* Cell color tiers */
.cell-ohko    { background: rgba(239,68,68,0.18); }
.cell-g2hko   { background: rgba(249,115,22,0.15); }
.cell-p2hko   { background: rgba(234,179,8,0.12); }
.cell-low     { background: transparent; }
.cell-zero    { background: transparent; }

/* ── Cell tooltip ── */
.cell-tooltip-wrap { position: relative; }
.cell-tooltip {
  display: none;
  position: absolute; z-index: 500;
  bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  width: 280px;
  background: rgb(8,12,24);
  border: 1px solid rgba(51,65,85,0.7);
  border-radius: 9px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.9);
  padding: 10px 12px;
  pointer-events: none;
}
.cell-tooltip-wrap:hover .cell-tooltip { display: block; }
/* flip to top if near bottom — handled via JS class */
.cell-tooltip.below { bottom: auto; top: calc(100% + 6px); }
.cell-tooltip-arrow {
  position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 8px; background: rgb(8,12,24);
  border-right: 1px solid rgba(51,65,85,0.7);
  border-bottom: 1px solid rgba(51,65,85,0.7);
  transform: translateX(-50%) rotate(45deg);
}
.cell-tooltip.below .cell-tooltip-arrow {
  bottom: auto; top: -5px;
  border-right: none; border-bottom: none;
  border-left: 1px solid rgba(51,65,85,0.7);
  border-top: 1px solid rgba(51,65,85,0.7);
}
.tooltip-descriptor {
  font-family: 'Roboto Mono', monospace; font-size: 9px;
  color: rgb(148,163,184); line-height: 1.5; margin-bottom: 6px;
  word-break: break-all;
}
.tooltip-verdict {
  font-size: 10px; font-weight: 800; margin-bottom: 6px;
}
.tooltip-rolls-label {
  font-size: 9px; color: rgb(71,85,105); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
}
.tooltip-rolls-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
  margin-bottom: 6px;
}
.tooltip-roll-val {
  font-family: 'Roboto Mono', monospace; font-size: 9px;
  text-align: center; padding: 2px 1px; border-radius: 3px;
  background: rgba(30,41,59,0.8); color: rgb(148,163,184);
}
.tooltip-roll-val.hi { background: rgba(239,68,68,0.2); color: #ef4444; }
.tooltip-bar-wrap {
  height: 4px; background: rgba(30,41,59,0.8);
  border-radius: 2px; overflow: visible; position: relative; margin-top: 4px;
}
.tooltip-bar-fill {
  height: 100%; border-radius: 2px; transition: width 0.2s;
}
.tooltip-bar-threshold {
  position: absolute; top: -3px; bottom: -3px; width: 1px;
  background: rgba(239,68,68,0.7);
}

/* ── PokéPaste import modal ── */
.paste-modal-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.paste-modal {
  background: rgb(8,12,24); border: 1px solid rgba(51,65,85,0.6);
  border-radius: 12px; padding: 20px; width: 480px; max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  display: flex; flex-direction: column; gap: 12px;
}
.paste-modal-title {
  font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase; color: rgb(251,146,60);
}
.paste-modal-textarea {
  background: rgba(3,5,15,0.9); border: 1px solid rgba(51,65,85,0.6);
  border-radius: 7px; padding: 10px; color: rgb(203,213,225);
  font-family: 'Roboto Mono', monospace; font-size: 11px;
  resize: vertical; min-height: 180px; outline: none;
  line-height: 1.5;
}
.paste-modal-textarea:focus { border-color: rgba(249,115,22,0.5); }
.paste-modal-error {
  font-size: 11px; color: rgb(252,165,165);
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 5px; padding: 6px 10px;
}
.paste-modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.paste-btn-cancel {
  background: rgba(30,41,59,0.8); border: 1px solid rgba(51,65,85,0.5);
  border-radius: 6px; padding: 7px 16px; color: rgb(148,163,184);
  font-size:12px; font-weight:600; cursor:pointer;
}
.paste-btn-import {
  background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.4);
  border-radius: 6px; padding: 7px 16px; color: rgb(251,146,60);
  font-size:12px; font-weight:700; cursor:pointer;
  transition: all 0.13s;
}
.paste-btn-import:hover { background: rgba(249,115,22,0.25); }
.import-btn {
  display: flex; align-items: center; gap: 5px; justify-content: center;
  background: rgba(3,5,15,0.5); border: 1px solid rgba(51,65,85,0.4);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
  font-size: 10px; font-weight: 700; color: rgb(100,116,139);
  transition: all 0.13s; white-space: nowrap;
}
.import-btn:hover { border-color: rgba(249,115,22,0.4); color: rgb(251,146,60); }

/* ── Speed view ── */
.speed-view {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: rgb(3,5,15);
}
.speed-controls {
  background: rgba(12,18,32,0.97);
  border-bottom: 1px solid rgba(51,65,85,0.4);
  padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.speed-controls-label {
  font-size: 10px; font-weight: 700; color: rgb(71,85,105);
  text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap;
}
.speed-timeline-wrap {
  flex: 1; overflow-x: auto; overflow-y: auto; padding: 16px 24px;
}
.speed-entry {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 4px 6px; cursor: default; min-width: 60px; flex-shrink: 0;
  border-radius: 6px; transition: background 0.12s;
}
.speed-entry:hover { background: rgba(249,115,22,0.08); }
.speed-entry.is-mine {
  background: rgba(249,115,22,0.15);
  outline: 2px solid rgba(249,115,22,0.5); outline-offset: 1px;
}
.speed-stat-val {
  font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 800;
  color: rgb(226,232,240);
}

<script type="text/babel">
const { useState, useMemo, useCallback, useRef, useEffect } = React;

// ── helpers ─────────────────────────────────────────────────────────────────
const POKE_NAMES = Object.keys(POKEMON_DATA);
const MOVE_NAMES = Object.keys(MOVES_DATA);

function typeBadgeStyle(type) {
  const col = TYPE_COLORS[type] || "#6b7280";
  return { background: col+"22", border:`1px solid ${col}44`, color:col };
}

function fmtPct(n) { return n.toFixed(1)+"%"; }

function mkDefaultPoke(name="Abomasnow") {
  return {
    name,
    level: 100,
    nature: "Timid",
    ability: POKEMON_DATA[name]?.ability || "None",
    item: "None",
    status: "Healthy",
    teraType: "None",
    evs: { hp:0, atk:0, def:0, spa:252, spd:0, spe:252 },
    ivs: { hp:31, atk:31, def:31, spa:31, spd:31, spe:31 },
    boost: 0,
    currentHP: -1,   // -1 = max
    moves: [
      { key:"Leaf Storm",  bp:130, type:"Grass",  cat:"special",  crit:false },
      { key:"Blizzard",    bp:110, type:"Ice",     cat:"special",  crit:false },
      { key:"Earth Power", bp:90,  type:"Ground",  cat:"special",  crit:false },
      { key:"Aurora Veil", bp:0,   type:"Ice",     cat:"status",   crit:false },
    ],
  };
}

// ── TypeBadge ────────────────────────────────────────────────────────────────
function TypeBadge({ type }) {
  if (!type || type==="None") return null;
  return <span className="type-badge" style={typeBadgeStyle(type)}>{type}</span>;
}

// ── PokéSearch combobox ───────────────────────────────────────────────────────
function PokeSearch({ value, onChange }) {
  const [q, setQ] = useState(value);
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const filtered = q ? POKE_NAMES.filter(n=>n.toLowerCase().includes(q.toLowerCase())) : POKE_NAMES;

  useEffect(() => { setQ(value); }, [value]);
  useEffect(() => {
    function h(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h);
  },[]);

  return (
    <div ref={ref} style={{position:"relative"}}>
      <input className="form-input" value={q}
        onFocus={()=>setOpen(true)}
        onChange={e=>{setQ(e.target.value);setOpen(true);}}
        placeholder="Buscar Pokémon..."
        style={{fontWeight:600, fontSize:12}}
      />
      {open && filtered.length > 0 && (
        <div style={{
          position:"absolute",top:"100%",left:0,right:0,zIndex:999,

// ── StatTable ────────────────────────────────────────────────────────────────
function StatTable({ poke, onChange }) {
  const p = POKEMON_DATA[poke.name];
  if (!p) return null;
  const nat = NATURES[poke.nature]||{};
  const statDefs = [
    {key:"hp",  label:"HP"},
    {key:"atk", label:"Attack"},
    {key:"def", label:"Defense"},
    {key:"spa", label:"Sp. Atk"},
    {key:"spd", label:"Sp. Def"},
    {key:"spe", label:"Speed"},
  ];
  const totalEvs = Object.values(poke.evs).reduce((a,b)=>a+b,0);

  return (
    <table className="stat-table">
      <thead>
        <tr>
          <th>Stat</th>
          <th>Base</th>
          <th>IVs</th>
          <th>EVs</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {statDefs.map(({key,label})=>{
          const isUp = nat.up===key, isDown = nat.down===key;
          const computed = calcStat(p[key], poke.level, poke.evs[key], poke.ivs[key], poke.nature, key);
          return (
            <tr key={key}>
              <td className={isUp?"stat-nat-up":isDown?"stat-nat-down":""} style={{fontSize:11}}>{label}</td>
              <td style={{color:"rgb(148,163,184)"}}>{p[key]}</td>
              <td>
                <input className="stat-input" type="number" min={0} max={31} value={poke.ivs[key]}
                  onChange={e=>onChange({ivs:{...poke.ivs,[key]:Math.min(31,Math.max(0,Number(e.target.value)))}})}
                />
              </td>
              <td>
                <input className="stat-input" type="number" min={0} max={252} step={4} value={poke.evs[key]}
                  onChange={e=>onChange({evs:{...poke.evs,[key]:Math.min(252,Math.max(0,Number(e.target.value)))}})}
                  style={{borderColor: totalEvs>508?"rgb(239,68,68)":""}}
                />
              </td>
              <td className={`stat-total ${isUp?"stat-nat-up":isDown?"stat-nat-down":""}`}>{computed}</td>
              <td style={{fontSize:10,color:"rgb(71,85,105)",paddingLeft:2}}>
                {isUp?"↑":isDown?"↓":""}
              </td>
            </tr>
          );
        })}
        <tr style={{borderTop:"1px solid rgba(51,65,85,0.4)"}}>
          <td colSpan={3} style={{color:"rgb(71,85,105)",fontSize:10}}>Total EVs</td>
          <td style={{color:totalEvs>508?"rgb(239,68,68)":"rgb(148,163,184)",fontWeight:700}}>{totalEvs}</td>
          <td style={{color:"rgb(100,116,139)",fontSize:12,fontWeight:700}}>
            {["hp","atk","def","spa","spd","spe"].reduce((s,k)=>s+calcStat(p[k],poke.level,poke.evs[k],poke.ivs[k],poke.nature,k),0)}
          </td>
          <td></td>
        </tr>
      </tbody>
    </table>
  );
}

// ── HPBar ────────────────────────────────────────────────────────────────────
function HPBar({ poke, onChange }) {
  const p = POKEMON_DATA[poke.name]; if (!p) return null;
  const maxHP = calcStat(p.hp, poke.level, poke.evs.hp, poke.ivs.hp, poke.nature, "hp");
  const cur = poke.currentHP < 0 ? maxHP : Math.min(poke.currentHP, maxHP);
  const pct = cur/maxHP*100;
  const barColor = pct>50?"rgb(74,222,128)":pct>25?"rgb(234,179,8)":"rgb(239,68,68)";
  return (
    <div className="hp-bar-wrap">
      <div className="hp-row">
        <span className="hp-label">HP Actual</span>
        <input className="stat-input" type="number" min={1} max={maxHP} value={cur}
          onChange={e=>onChange({currentHP:Math.min(maxHP,Math.max(1,Number(e.target.value)))})}
          style={{width:52}}
        />
        <span className="hp-val">/ {maxHP}</span>
        <span style={{fontSize:11,color:barColor,fontWeight:700,marginLeft:4}}>({fmtPct(pct)})</span>
        <button onClick={()=>onChange({currentHP:-1})} style={{
          marginLeft:"auto",fontSize:10,color:"rgb(71,85,105)",background:"none",border:"none",cursor:"pointer"
        }}>Reset</button>
      </div>
      <div className="hp-bar-track">
        <div className="hp-bar-fill" style={{width:`${pct}%`,background:barColor}} />
      </div>
    </div>
  );
}

// ── helpers for strip ────────────────────────────────────────────────────────
function buildDescriptor(atkPoke, defPoke, mv, res) {
  if (!res) return null;
  const isPhys = res.isPhys;
  const statKey = isPhys ? "atk" : "spa";
  const evAmt = atkPoke.evs[statKey];
  return `${evAmt} ${isPhys?"Atk":"SpA"} ${atkPoke.name} ${mv.key} vs. ${defPoke.evs.hp} HP / ${defPoke.evs[isPhys?"def":"spd"]} ${isPhys?"Def":"SpD"} ${defPoke.name}: ${res.min}–${res.max} (${fmtPct(res.minPct)} – ${fmtPct(res.maxPct)})`;
}

function getVerdict(res) {
  if (!res) return null;
  const ohko  = res.minPct >= 100;
  const g2hko = !ohko && res.minPct * 2 >= 100;
  const p2hko = !ohko && !g2hko && res.maxPct * 2 >= 100;
  return {
    label: ohko ? "guaranteed OHKO" : g2hko ? "guaranteed 2HKO" : p2hko ? "possible 2HKO" : "no KO",
    color: ohko ? "#ef4444" : g2hko ? "#f97316" : p2hko ? "#eab308" : "rgb(100,116,139)",
  };
}

function pctColor(res) {
  if (!res) return "rgb(71,85,105)";
  if (res.maxPct >= 100) return "#ef4444";
  if (res.maxPct >= 75)  return "#f97316";
  if (res.maxPct >= 50)  return "#eab308";
  return "rgb(100,116,139)";
}

// ── MoveStrip ─────────────────────────────────────────────────────────────────
function MoveStrip({ poke1, poke2, activeP1, setActiveP1, activeP2, setActiveP2, result1, result2 }) {
  const p1data = POKEMON_DATA[poke1.name];
  const p2data = POKEMON_DATA[poke2.name];

  // HP info
  function hpInfo(poke, pdata) {
    if (!pdata) return { cur: 0, max: 1, pct: 100 };
    const max = calcStat(pdata.hp, poke.level, poke.evs.hp, poke.ivs.hp, poke.nature, "hp");
    const cur = poke.currentHP < 0 ? max : Math.min(poke.currentHP, max);
    return { cur, max, pct: cur / max * 100 };
  }

  const hp1 = hpInfo(poke1, p1data);
  const hp2 = hpInfo(poke2, p2data);
  const bar1Color = hp1.pct > 50 ? "rgb(74,222,128)" : hp1.pct > 25 ? "rgb(234,179,8)" : "rgb(239,68,68)";
  const bar2Color = hp2.pct > 50 ? "rgb(74,222,128)" : hp2.pct > 25 ? "rgb(234,179,8)" : "rgb(239,68,68)";

  // Active results
  const activeRes1 = activeP1 !== null ? result1[activeP1] : null;
  const activeRes2 = activeP2 !== null ? result2[activeP2] : null;
  const activeMv1  = activeP1 !== null ? poke1.moves[activeP1] : null;
  const activeMv2  = activeP2 !== null ? poke2.moves[activeP2] : null;
  const verdict1   = getVerdict(activeRes1);
  const verdict2   = getVerdict(activeRes2);
  const desc1      = activeMv1 && activeRes1 ? buildDescriptor(poke1, poke2, activeMv1, activeRes1) : null;
  const desc2      = activeMv2 && activeRes2 ? buildDescriptor(poke2, poke1, activeMv2, activeRes2) : null;

  function RollPills({ poke, setter, active }) {
    return (
      <div className="strip-roll-row">
        <span className="strip-roll-label">Roll</span>
        {["Low","Med","High"].map(r => (
          <button key={r} className={`strip-roll-pill ${active===r?"active":""}`}
            onClick={() => setter(r)}
          >{r}</button>
        ))}
      </div>
    );
  }

  // Roll level state — per-side, stored here but could be lifted
  const [roll1, setRoll1] = React.useState("High");
  const [roll2, setRoll2] = React.useState("High");

  return (
    <div className="move-strip">
      <div className="move-strip-top">

        {/* ── Left half: Poke1 info + moves ── */}
        <div className="move-half">
          {/* Poke info */}
          <div className="move-poke-info">
            <div className="move-poke-header">
              {p1data && <img className="move-poke-sprite" src={p1data.sprite} width={44} height={44}/>}
              <div>
                <div className="move-poke-name">{poke1.name}</div>
                <div className="move-poke-lvl">Lv. {poke1.level}</div>
              </div>
            </div>
            {/* HP bar */}
            <div className="strip-hp-wrap">
              <div className="strip-hp-row">
                <span style={{color:"rgb(100,116,139)"}}>0/</span>
                <span style={{color:bar1Color,fontWeight:700}}>{hp1.cur}</span>
                <div className="strip-hp-track" style={{flex:1}}>
                  <div className="strip-hp-fill" style={{width:`${hp1.pct}%`,background:bar1Color}}/>
                </div>
              </div>
            </div>
            {/* Status badge */}

// ── useComputeResults ─────────────────────────────────────────────────────────
function useComputeResults(atkPoke, defPoke, field) {
  return useMemo(() => {
    const atkP = POKEMON_DATA[atkPoke.name];
    const defP = POKEMON_DATA[defPoke.name];
    if (!atkP || !defP) return [];

    return atkPoke.moves.map(mv => {
      if (!mv.key || !MOVES_DATA[mv.key] || mv.bp===0) return null;
      // Override move with slot customizations
      const mvOverride = { ...MOVES_DATA[mv.key], bp: mv.bp, type: mv.type, cat: mv.cat };
      const key = mv.key;
      return calcDamageRolls({
        atkPoke: atkP, defPoke: defP,
        moveKey: key,
        atkEVs: atkPoke.evs, atkIVs: atkPoke.ivs, atkNature: atkPoke.nature,
        atkLevel: atkPoke.level, atkBoost: atkPoke.boost,
        atkStatus: atkPoke.status, atkItem: atkPoke.item, atkAbility: atkPoke.ability,
        defEVs: defPoke.evs, defIVs: defPoke.ivs, defNature: defPoke.nature,
        defLevel: defPoke.level, defBoost: defPoke.boost,
        defStatus: defPoke.status, defItem: defPoke.item, defAbility: defPoke.ability,
        defCurrentHP: defPoke.currentHP,
        weather: field.weather||"None", terrain: field.terrain||"None",
        crit: mv.crit, defTera: defPoke.teraType,
      });
    });
  }, [atkPoke, defPoke, field]);
}

// ── calcMoveVs: damage for a specific move ───────────────────────────────────
function calcMoveVs(atkPoke, defPoke, mv, field) {
  const atkP = POKEMON_DATA[atkPoke.name];
  const defP = POKEMON_DATA[defPoke.name];
  if (!atkP || !defP || !mv.key || !MOVES_DATA[mv.key] || mv.bp === 0) return null;
  return calcDamageRolls({
    atkPoke: atkP, defPoke: defP, moveKey: mv.key,
    atkEVs: atkPoke.evs, atkIVs: atkPoke.ivs, atkNature: atkPoke.nature,
    atkLevel: atkPoke.level, atkBoost: atkPoke.boost,
    atkStatus: atkPoke.status, atkItem: atkPoke.item, atkAbility: atkPoke.ability,
    defEVs: defPoke.evs, defIVs: defPoke.ivs, defNature: defPoke.nature,
    defLevel: defPoke.level, defBoost: defPoke.boost,
    defStatus: defPoke.status, defItem: defPoke.item, defAbility: defPoke.ability,
    defCurrentHP: defPoke.currentHP,
    weather: field.weather||"None", terrain: field.terrain||"None",
    crit: mv.crit, defTera: defPoke.teraType,
  });
}

// ── PokéPaste parser ──────────────────────────────────────────────────────────
function parsePokePaste(text) {
  const blocks = text.trim().split(/\n\s*\n+/);
  const result = [];
  for (const block of blocks) {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const poke = mkDefaultPoke("Abomasnow");

    // Line 1: Name @ Item  OR  Name (Nickname) @ Item
    const line0 = lines[0];
    const itemMatch = line0.match(/@\s*(.+)$/);
    if (itemMatch) {
      const itemName = itemMatch[1].trim();
      if (ITEMS.includes(itemName)) poke.item = itemName;
    }
    let namePart = line0.replace(/@.*$/, '').trim();
    // strip nickname: "Nickname (Species)"
    const nicknameMatch = namePart.match(/\(([^)]+)\)\s*$/);
    if (nicknameMatch) namePart = nicknameMatch[1].trim();
    // strip gender markers
    namePart = namePart.replace(/\s*\(M\)|\s*\(F\)/g, '').trim();
    // Find closest matching Pokémon name
    const exactMatch = POKE_NAMES.find(n => n.toLowerCase() === namePart.toLowerCase());
    const partialMatch = !exactMatch && POKE_NAMES.find(n => n.toLowerCase().includes(namePart.toLowerCase()));
    const pokeMatch = exactMatch || partialMatch;
    if (!pokeMatch) continue;
    poke.name = pokeMatch;
    const pdata = POKEMON_DATA[pokeMatch];
    if (pdata) poke.ability = pdata.ability || "None";

    // Reset EVs/IVs to 0/31
    poke.evs = { hp:0, atk:0, def:0, spa:0, spd:0, spe:0 };
    poke.ivs = { hp:31, atk:31, def:31, spa:31, spd:31, spe:31 };
    poke.moves = [
      { key:"", bp:0, type:"Normal", cat:"physical", crit:false },
      { key:"", bp:0, type:"Normal", cat:"physical", crit:false },
      { key:"", bp:0, type:"Normal", cat:"physical", crit:false },
      { key:"", bp:0, type:"Normal", cat:"physical", crit:false },
    ];
    let moveIdx = 0;

    for (let i = 1; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('Ability:')) {
        const ab = l.replace('Ability:', '').trim();
        if (ABILITIES.includes(ab)) poke.ability = ab;
      } else if (l.startsWith('Level:')) {
        poke.level = parseInt(l.replace('Level:', '').trim()) || 100;
      } else if (l.startsWith('EVs:')) {
        const evStr = l.replace('EVs:', '').trim();
        const evParts = evStr.split('/').map(s => s.trim());
        for (const part of evParts) {
          const m = part.match(/(\d+)\s+(HP|Atk|Def|SpA|SpD|Spe)/i);
          if (m) {
            const val = parseInt(m[1]);
            const stat = m[2].toLowerCase();
            const map = { hp:'hp', atk:'atk', def:'def', spa:'spa', spd:'spd', spe:'spe' };
            if (map[stat] !== undefined) poke.evs[map[stat]] = val;
          }
        }
      } else if (l.startsWith('IVs:')) {
        const ivStr = l.replace('IVs:', '').trim();
        const ivParts = ivStr.split('/').map(s => s.trim());
        for (const part of ivParts) {
          const m = part.match(/(\d+)\s+(HP|Atk|Def|SpA|SpD|Spe)/i);
          if (m) {
            const val = parseInt(m[1]);
            const stat = m[2].toLowerCase();
            const map = { hp:'hp', atk:'atk', def:'def', spa:'spa', spd:'spd', spe:'spe' };
            if (map[stat] !== undefined) poke.ivs[map[stat]] = val;
          }
        }
      } else if (l.includes('Nature')) {
        const natMatch = l.match(/^(\w+)\s+Nature/);
        if (natMatch && NATURES[natMatch[1]]) poke.nature = natMatch[1];
      } else if (l.startsWith('Tera Type:')) {
        poke.teraType = l.replace('Tera Type:', '').trim();
      } else if (l.startsWith('-') || l.startsWith('–')) {
        if (moveIdx < 4) {
          const mvName = l.replace(/^[-–]\s*/, '').trim();
          const exact = MOVE_NAMES.find(m => m.toLowerCase() === mvName.toLowerCase());
          const partial = !exact && MOVE_NAMES.find(m => m.toLowerCase().includes(mvName.toLowerCase()));
          const mvMatch = exact || partial;
          if (mvMatch) {
            const d = MOVES_DATA[mvMatch];
            poke.moves[moveIdx] = { key: mvMatch, bp: d?d.bp:0, type: d?d.type:"Normal", cat: d?d.cat:"physical", crit: false };
          }
          moveIdx++;
        }
      }
    }
    result.push(poke);
  }
  return result;
}

// ── PokéPaste Import Modal ────────────────────────────────────────────────────
function PasteImportModal({ onImport, onClose, maxSlots }) {
  const [text, setText] = useState('');
  const [error, setError] = useState('');

  function handleImport() {
    if (!text.trim()) { setError('Pega un equipo en formato PokéPaste.'); return; }
    const parsed = parsePokePaste(text);
    if (!parsed.length) { setError('No se encontraron Pokémon válidos. Verifica el formato.'); return; }
    const limited = parsed.slice(0, maxSlots);
    onImport(limited);
    onClose();
  }

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="paste-modal-overlay" onClick={e => e.target===e.currentTarget&&onClose()}>
      <div className="paste-modal">
        <div className="paste-modal-title">📋 Importar PokéPaste</div>
        <div style={{fontSize:11,color:"rgb(100,116,139)",lineHeight:1.6}}>
          Pega un equipo en formato <span style={{color:"rgb(203,213,225)",fontFamily:"'Roboto Mono',monospace"}}>Showdown/PokéPaste</span>. Puedes importar un solo Pokémon o un equipo completo.
        </div>
        <textarea
          className="paste-modal-textarea"
          placeholder={"Abomasnow @ Choice Specs\nAbility: Snow Warning\nLevel: 50\nEVs: 252 SpA / 4 SpD / 252 Spe\nTimid Nature\nIVs: 0 Atk\n- Blizzard\n- Leaf Storm\n- Earth Power\n- Aurora Veil"}
          value={text}
          onChange={e => { setText(e.target.value); setError(''); }}
          autoFocus
        />
        {error && <div className="paste-modal-error">{error}</div>}
        <div className="paste-modal-btns">
          <button className="paste-btn-cancel" onClick={onClose}>Cancelar</button>
          <button className="paste-btn-import" onClick={handleImport}>
            Importar ({text.trim() ? Math.min(parsePokePaste(text).length, maxSlots) : 0} Pokémon)
          </button>
        </div>
      </div>
    </div>
  );
}

// ── CellTooltip ───────────────────────────────────────────────────────────────
function CellTooltipContent({ res, mv, atkPoke, defPoke }) {
  if (!res) return null;
  const isPhys = res.isPhys;
  const statKey = isPhys ? "atk" : "spa";
  const evAmt = atkPoke.evs[statKey];
  const descriptor = `${evAmt} ${isPhys?"Atk":"SpA"} ${atkPoke.name} ${mv.key} vs. ${defPoke.evs.hp} HP / ${defPoke.evs[isPhys?"def":"spd"]} ${isPhys?"Def":"SpD"} ${defPoke.name}: ${res.min}–${res.max} (${fmtPct(res.minPct)}–${fmtPct(res.maxPct)})`;
  const ohko  = res.minPct >= 100;
  const g2hko = !ohko && res.minPct * 2 >= 100;
  const p2hko = !ohko && !g2hko && res.maxPct * 2 >= 100;
  const verdictLabel = ohko ? "guaranteed OHKO" : g2hko ? "guaranteed 2HKO" : p2hko ? "possible 2HKO" : "no KO";
  const verdictColor = ohko ? "#ef4444" : g2hko ? "#f97316" : p2hko ? "#eab308" : "rgb(100,116,139)";

  // rolls: array of 16 damage values
  const rolls = res.rolls || [];
  const maxDmg = res.defHP || 1;
  const maxRoll = rolls.length ? Math.max(...rolls) : res.max;

  return (
    <div className="cell-tooltip">
      <div className="tooltip-descriptor">{descriptor}</div>
      <div className="tooltip-verdict" style={{color:verdictColor}}>— {verdictLabel}</div>
      {rolls.length > 0 && (
        <>
          <div className="tooltip-rolls-label">Tiradas de daño</div>
          <div className="tooltip-rolls-grid">
            {rolls.map((v, i) => (
              <div key={i} className={`tooltip-roll-val ${v >= maxDmg ? "hi" : ""}`}>{v}</div>
            ))}
          </div>
          {/* Distribution bar */}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:9,color:"rgb(71,85,105)",minWidth:20}}>{res.min}</span>
            <div className="tooltip-bar-wrap" style={{flex:1}}>
              <div className="tooltip-bar-fill" style={{
                width:`${(res.maxPct/200)*100}%`,
                background: `linear-gradient(90deg, ${verdictColor}66, ${verdictColor})`,
                minWidth: 4,
              }}/>
              {/* 100% threshold marker */}
              <div className="tooltip-bar-threshold" style={{left:`${(100/200)*100}%`}}/>
            </div>
            <span style={{fontSize:9,color:"rgb(71,85,105)",minWidth:20,textAlign:"right"}}>{res.max}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
            <span style={{fontSize:9,color:"rgb(71,85,105)"}}>{fmtPct(res.minPct)}</span>
            <span style={{fontSize:9,color:"rgb(71,85,105)"}}>100%</span>
            <span style={{fontSize:9,color:"rgb(71,85,105)"}}>{fmtPct(res.maxPct)}</span>
          </div>
        </>
      )}
      <div className="cell-tooltip-arrow"/>
    </div>
  );
}

// ── applyMods + ModPills ──────────────────────────────────────────────────────
function applyMods(spd, mods) {
  let s = spd;
  if (mods.tailwind)    s = Math.floor(s * 2);
  if (mods.paralyzed)   s = Math.floor(s * 0.5);
  if (mods.choiceScarf) s = Math.floor(s * 1.5);
  if (mods.boostPlus2)  s = Math.floor(s * 2);
  else if (mods.boostPlus1)  s = Math.floor(s * 1.5);
  if (mods.boostMinus2) s = Math.floor(s * 0.5);
  else if (mods.boostMinus1) s = Math.floor(s * (2/3));
  return s;
}
const EMPTY_MODS = { tailwind:false, paralyzed:false, choiceScarf:false, trickRoom:false, boostPlus1:false, boostPlus2:false, boostMinus1:false, boostMinus2:false };
const MOD_DEF = [
  { k:"tailwind",    label:"Tailwind",  bg:"rgba(6,182,212,0.15)",  bc:"rgba(6,182,212,0.5)",  col:"rgb(103,232,249)" },
  { k:"choiceScarf", label:"Scarf",     bg:"rgba(249,115,22,0.15)", bc:"rgba(249,115,22,0.5)", col:"rgb(251,146,60)" },
  { k:"paralyzed",   label:"Paralyzed", bg:"rgba(239,68,68,0.15)",  bc:"rgba(239,68,68,0.5)",  col:"#ef4444" },
  { k:"trickRoom",   label:"Trick Room",bg:"rgba(168,85,247,0.15)", bc:"rgba(168,85,247,0.5)", col:"rgb(192,132,252)" },
  { k:"boostPlus1",  label:"+1",        bg:"rgba(132,204,22,0.15)", bc:"rgba(132,204,22,0.5)", col:"rgb(163,230,53)" },
  { k:"boostPlus2",  label:"+2",        bg:"rgba(132,204,22,0.25)", bc:"rgba(132,204,22,0.7)", col:"rgb(163,230,53)" },
  { k:"boostMinus1", label:"-1",        bg:"rgba(239,68,68,0.12)",  bc:"rgba(239,68,68,0.4)",  col:"#ef4444" },
  { k:"boostMinus2", label:"-2",        bg:"rgba(239,68,68,0.22)",  bc:"rgba(239,68,68,0.7)",  col:"#ef4444" },
];
function ModPills({ mods, toggle, label, accentColor }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}}>
      {label && <span style={{fontSize:9,fontWeight:700,color:accentColor||"rgb(71,85,105)",textTransform:"uppercase",letterSpacing:"0.06em",marginRight:2,whiteSpace:"nowrap"}}>{label}</span>}
      {MOD_DEF.map(({k,label:pl,bg,bc,col}) => (
        <button key={k} className="strip-roll-pill" style={mods[k]?{background:bg,borderColor:bc,color:col}:{}} onClick={()=>toggle(k)}>{pl}</button>
      ))}
    </div>
  );
}

// ── calcSpeed stub (kept for compat) ─────────────────────────────────────────
function calcSpeed(poke, modifiers) {
  const p = POKEMON_DATA[poke.name];
  if (!p) return 0;
  let spd = calcStat(p.spe, poke.level, poke.evs.spe, poke.ivs.spe, poke.nature, "spe");
  if (modifiers.trickRoom) spd = Math.floor(spd); // TR doesn't change val, just order
  if (modifiers.tailwind) spd = Math.floor(spd * 2);
  if (modifiers.paralyzed) spd = Math.floor(spd * 0.5);
  if (modifiers.choiceScarf) spd = Math.floor(spd * 1.5);
  if (modifiers.unburden) spd = Math.floor(spd * 2);
  if (modifiers.boostPlus1) spd = Math.floor(spd * 1.5);
  if (modifiers.boostPlus2) spd = Math.floor(spd * 2);
  if (modifiers.boostMinus1) spd = Math.floor(spd * (2/3));
  if (modifiers.boostMinus2) spd = Math.floor(spd * 0.5);
  return spd;
}

// Build a large reference speed list from all Pokémon in the data
function buildSpeedList(level, modifiers) {
  return POKE_NAMES.map(name => {
    const p = POKEMON_DATA[name];
    if (!p) return null;
    // Calculate min (0 EVs, 31 IVs, neutral nature) and max (252 EVs, 31 IVs, +nature)
    const minSpd = calcStat(p.spe, level, 0, 31, "Hardy", "spe");
    const maxSpd = calcStat(p.spe, level, 252, 31, "Timid", "spe");
    return { name, sprite: p.sprite, baseSpe: p.spe, minSpd, maxSpd };
  }).filter(Boolean);
}

// ── SpeedView ─────────────────────────────────────────────────────────────────
function SpeedView({ team, many }) {
  const [level, setLevel]       = React.useState(50);
  const [myMods,   setMyMods]   = React.useState({...EMPTY_MODS});
  const [foesMods, setFoesMods] = React.useState({...EMPTY_MODS});
  const [filterName, setFilterName] = React.useState("");

  function toggleMy(k)   { setMyMods(m  => ({...m, [k]: !m[k]})); }
  function toggleFoes(k) { setFoesMods(m => ({...m, [k]: !m[k]})); }

  // My team entries — actual EVs/nature + two reference entries (neutral/+spe)
  const teamEntries = useMemo(() => team.map(p => {
    const pd = POKEMON_DATA[p.name]; if (!pd) return null;
    const actual  = applyMods(calcStat(pd.spe, level, p.evs.spe, p.ivs.spe, p.nature, "spe"), myMods);
    const neutral = applyMods(calcStat(pd.spe, level, 0, 31, "Hardy", "spe"), myMods);
    const plus    = applyMods(calcStat(pd.spe, level, 252, 31, "Timid", "spe"), myMods);
    return { name:p.name, sprite:pd.sprite, baseSpe:pd.spe, actual, neutral, plus };
  }).filter(Boolean).sort((a,b) => myMods.trickRoom ? b.actual-a.actual : a.actual-b.actual), [team, level, myMods]);

  // Foes entries
  const foesEntries = useMemo(() => many.map(p => {
    const pd = POKEMON_DATA[p.name]; if (!pd) return null;
    const actual  = applyMods(calcStat(pd.spe, level, p.evs.spe, p.ivs.spe, p.nature, "spe"), foesMods);
    const neutral = applyMods(calcStat(pd.spe, level, 0, 31, "Hardy", "spe"), foesMods);
    const plus    = applyMods(calcStat(pd.spe, level, 252, 31, "Timid", "spe"), foesMods);
    return { name:p.name, sprite:pd.sprite, baseSpe:pd.spe, actual, neutral, plus };
  }).filter(Boolean).sort((a,b) => foesMods.trickRoom ? b.actual-a.actual : a.actual-b.actual), [many, level, foesMods]);

  // Reference list — show neutral + +spe as two values per entry
  const refEntries = useMemo(() => {
    return POKE_NAMES
      .filter(n => !filterName || n.toLowerCase().includes(filterName.toLowerCase()))
      .slice(0, 100)
      .map(name => {
        const p = POKEMON_DATA[name]; if (!p) return null;
        const neutral = applyMods(calcStat(p.spe, level, 0, 31, "Hardy", "spe"), myMods);
        const plus    = applyMods(calcStat(p.spe, level, 252, 31, "Timid", "spe"), myMods);
        const isMine = team.some(t=>t.name===name);
        const isFoe  = many.some(f=>f.name===name);
        return { name, sprite:p.sprite, baseSpe:p.spe, neutral, plus, isMine, isFoe };
      }).filter(Boolean)
      .sort((a,b) => myMods.trickRoom ? b.neutral-a.neutral : a.neutral-b.neutral);
  }, [POKE_NAMES, level, myMods, filterName, team, many]);

  function SpdCard({ name, sprite, baseSpe, actual, neutral, plus, color, showActual }) {
    return (
      <div className="speed-entry" style={{outline: color?`2px solid ${color}55`:"none", background: color?`${color}0d`:"transparent", borderRadius:7}}>
        <img className="speed-sprite" src={sprite} width={36} height={36}/>
        <div className="speed-name" style={{color: color||"rgb(100,116,139)"}}>{name}</div>
        {showActual ? (
          <div style={{fontFamily:"'Roboto Mono',monospace",fontSize:11,fontWeight:800,color:color||"rgb(226,232,240)"}}>{actual}</div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:0,alignItems:"center"}}>
            <div style={{fontFamily:"'Roboto Mono',monospace",fontSize:10,fontWeight:800,color:color||"rgb(203,213,225)"}}>{plus}</div>
            <div style={{fontFamily:"'Roboto Mono',monospace",fontSize:9,color:"rgb(71,85,105)"}}>{neutral}</div>
          </div>
        )}
        <div style={{fontSize:8,color:"rgb(71,85,105)"}}>base {baseSpe}</div>
      </div>
    );
  }

  function Divider({ label, color }) {
    return (
      <div style={{fontSize:10,fontWeight:700,color:color||"rgb(71,85,105)",textTransform:"uppercase",letterSpacing:"0.08em",margin:"0 0 8px",display:"flex",alignItems:"center",gap:6}}>
        <span style={{flex:1,height:1,background:`${color||"rgba(51,65,85,1)"}33`,display:"block"}}/>
        {label}
        <span style={{flex:1,height:1,background:`${color||"rgba(51,65,85,1)"}33`,display:"block"}}/>
      </div>
    );
  }

  return (
    <div className="speed-view">
      {/* Controls */}
      <div className="speed-controls" style={{flexDirection:"column",alignItems:"flex-start",gap:8,padding:"10px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span className="speed-controls-label">Nivel</span>

        {/* Rivals */}
        {foesEntries.length > 0 && (
          <div style={{marginBottom:20}}>
            <Divider label="Rivales" color="rgb(168,85,247)"/>

              {foesEntries.map((p,i) => <SpdCard key={i} {...p} color="rgb(168,85,247)" showActual={true}/>)}

        <Divider label={`Referencia — top: +spe 252EVs / bottom: neutral (${refEntries.length} Pokémon${filterName?" filtrados":""})`}/>

            <div style={{fontSize:12,color:"rgb(71,85,105)",padding:"40px 0",textAlign:"center",width:"100%"}}>
              No se encontraron Pokémon con ese filtro

      </div>
    </div>
  );
}

// ── TypeCalcView ──────────────────────────────────────────────────────────────
const ALL_TYPES = ["Normal","Fire","Water","Grass","Electric","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Steel","Dark","Fairy"];

function TypeCalcView({ team }) {
  // Offensive coverage: for each attacking type, how does it do vs each team member?
  // Defensive coverage: for each defending type (team member types), how does each attacking type do?

  const teamPokes = team.map(p => {
    const pd = POKEMON_DATA[p.name];
    return pd ? { name: p.name, sprite: pd.sprite, types: pd.types } : null;
  }).filter(Boolean);

  // ── Offensive Coverage: rows=attack types, cols=defenders ──
  function offEff(atkType, defTypes) {
    return getTypeEff(atkType, defTypes);
  }

  // ── Defensive Coverage: rows=attack types, cols=defenders ──
  // (same matrix, just different framing in the UI)

  // ── Insights ──
  const offInsights = useMemo(() => {
    if (!teamPokes.length) return [];
    return teamPokes.map(p => {
      let superEff = 0, notVery = 0, immune = 0;
      for (const t of ALL_TYPES) {
        const eff = getTypeEff(t, p.types);
        if (eff >= 2) superEff++;
        else if (eff > 0 && eff < 1) notVery++;
        else if (eff === 0) immune++;
      }
      // Best offensive type coverage for this poke's moves (simplified: just types)
      return { name: p.name, sprite: p.sprite, types: p.types, superEff, notVery, immune };
    });
  }, [teamPokes]);

  // Best shared offensive type (most super-effectives across all team members combined)
  const bestOffType = useMemo(() => {
    if (!teamPokes.length) return null;
    let best = null, bestCount = 0;
    for (const t of ALL_TYPES) {
      const count = teamPokes.filter(p => getTypeEff(t, p.types) >= 2).length;
      if (count > bestCount) { bestCount = count; best = t; }
    }
    return best ? { type: best, count: bestCount } : null;
  }, [teamPokes]);

  const worstOffType = useMemo(() => {
    if (!teamPokes.length) return null;
    let worst = null, worstCount = 0;
    for (const t of ALL_TYPES) {
      const count = teamPokes.filter(p => { const e = getTypeEff(t, p.types); return e > 0 && e < 1; }).length;
      if (count > worstCount) { worstCount = count; worst = t; }
    }
    return worst ? { type: worst, count: worstCount } : null;
  }, [teamPokes]);

  // Defensive insights per poke
  const defInsights = useMemo(() => {
    if (!teamPokes.length) return [];
    return teamPokes.map(p => {
      let weaknesses = 0, resistances = 0, immunities = 0, doubleWeak = 0;
      for (const t of ALL_TYPES) {
        const eff = getTypeEff(t, p.types);
        if (eff >= 4) { weaknesses++; doubleWeak++; }
        else if (eff >= 2) weaknesses++;
        else if (eff === 0) immunities++;
        else if (eff < 1) resistances++;
      }
      return { name: p.name, sprite: p.sprite, types: p.types, weaknesses, resistances, immunities, doubleWeak };
    });
  }, [teamPokes]);

  const bestDefType = useMemo(() => {
    if (!teamPokes.length) return null;
    let best = null, bestCount = 0;
    for (const t of ALL_TYPES) {
      const count = teamPokes.filter(p => { const e = getTypeEff(t, p.types); return e > 0 && e < 1; }).length;
      if (count > bestCount) { bestCount = count; best = t; }
    }
    return best ? { type: best, count: bestCount } : null;
  }, [teamPokes]);

  function effLabel(eff) {
    if (eff === 0) return "Immune";
    if (eff === 0.25) return "¼x";
    if (eff === 0.5) return "½x";
    if (eff === 1) return "";
    if (eff === 2) return "2x";
    if (eff === 4) return "4x";
    return `${eff}x`;
  }
  function effClass(eff) {
    if (eff === 0) return "eff-0";
    if (eff < 0.5) return "eff-qtr";
    if (eff < 1) return "eff-half";
    if (eff === 1) return "eff-1";
    if (eff >= 4) return "eff-4x";
    return "eff-2x";
  }

  if (teamPokes.length === 0) {
    return (
      <div className="typecalc-view">
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",flex:1,flexDirection:"column",gap:8}}>
          <div style={{fontSize:32,opacity:0.15}}>🔮</div>
          <div style={{fontSize:12,color:"rgb(71,85,105)"}}>Añade Pokémon a tu equipo para ver el análisis de tipos</div>
        </div>
      </div>
    );
  }

  return (
    <div className="typecalc-view">
      <div className="typecalc-body">

        {/* ── Insights ── */}
        <div style={{background:"rgba(8,12,24,0.97)",border:"1px solid rgba(51,65,85,0.4)",borderRadius:10,overflow:"hidden"}}>
          <div style={{padding:"8px 12px",borderBottom:"1px solid rgba(51,65,85,0.3)",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,fontWeight:800,letterSpacing:"0.12em",textTransform:"uppercase",color:"rgb(251,146,60)"}}>Insights</span>
          </div>
          <div className="insights-grid">
            {/* Offensive */}
            <div className="insights-half">
              <div className="insights-title">Offensive</div>
              {offInsights.map((p,i) => (
                <div key={i} className="insight-row">
                  <div className="insight-sprite-box" style={{borderColor:`${TYPE_COLORS[p.types[0]]||"#6b7280"}66`,background:`${TYPE_COLORS[p.types[0]]||"#6b7280"}22`}}>
                    <img src={p.sprite} width={32} height={32} style={{imageRendering:"pixelated"}}/>
                  </div>
                  <div className="insight-text">
                    <strong>{p.superEff}</strong> super effective<br/>
                    <span style={{fontSize:10,color:"rgb(100,116,139)"}}>{p.notVery} not very effective</span>
                  </div>
                </div>
              ))}
              {bestOffType && (
                <div style={{background:"rgba(30,41,59,0.6)",borderRadius:7,padding:"8px 10px",marginTop:4}}>
                  <div style={{fontSize:10,color:"rgb(100,116,139)",marginBottom:4}}>{bestOffType.count} super effective to</div>
                  <span className="insight-badge" style={{background:`${TYPE_COLORS[bestOffType.type]||"#6b7280"}33`,borderColor:`${TYPE_COLORS[bestOffType.type]||"#6b7280"}66`,color:TYPE_COLORS[bestOffType.type]||"#9ca3af"}}>{bestOffType.type}</span>
                </div>
              )}
              {worstOffType && (
                <div style={{background:"rgba(30,41,59,0.6)",borderRadius:7,padding:"8px 10px",marginTop:4}}>
                  <div style={{fontSize:10,color:"rgb(100,116,139)",marginBottom:4}}>{worstOffType.count} not very effective to</div>
                  <span className="insight-badge" style={{background:`${TYPE_COLORS[worstOffType.type]||"#6b7280"}33`,borderColor:`${TYPE_COLORS[worstOffType.type]||"#6b7280"}66`,color:TYPE_COLORS[worstOffType.type]||"#9ca3af"}}>{worstOffType.type}</span>
                </div>
              )}
            </div>
            {/* Defensive */}
            <div className="insights-half" style={{borderLeft:"1px solid rgba(51,65,85,0.3)"}}>
              <div className="insights-title">Defensive</div>
              {defInsights.map((p,i) => (
                <div key={i} className="insight-row">
                  <div className="insight-sprite-box" style={{borderColor:`${TYPE_COLORS[p.types[0]]||"#6b7280"}66`,background:`${TYPE_COLORS[p.types[0]]||"#6b7280"}22`}}>
                    <img src={p.sprite} width={32} height={32} style={{imageRendering:"pixelated"}}/>
                  </div>
                  <div className="insight-text">
                    {p.immunities > 0 && <><strong>{p.immunities}</strong> immunities<br/></>}
                    <strong>{p.resistances}</strong> resistances<br/>
                    <span style={{color:p.weaknesses>0?"rgb(252,165,165)":"inherit"}}>
                      <strong>{p.weaknesses}</strong> weaknesses{p.doubleWeak>0?` (${p.doubleWeak}×4)`:""}
                    </span>
                  </div>
                </div>
              ))}
              {bestDefType && (
                <div style={{background:"rgba(30,41,59,0.6)",borderRadius:7,padding:"8px 10px",marginTop:4}}>
                  <div style={{fontSize:10,color:"rgb(100,116,139)",marginBottom:4}}>{bestDefType.count} resistances to</div>
                  <span className="insight-badge" style={{background:`${TYPE_COLORS[bestDefType.type]||"#6b7280"}33`,borderColor:`${TYPE_COLORS[bestDefType.type]||"#6b7280"}66`,color:TYPE_COLORS[bestDefType.type]||"#9ca3af"}}>{bestDefType.type}</span>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* ── Coverage matrices side by side ── */}
        <div className="typecalc-half">
          {/* Offensive Coverage */}
          <div className="typecalc-section">
            <div className="typecalc-section-title off">⚔ Offensive Coverage</div>
            <div style={{overflowX:"auto"}}>
              <table className="cov-table">
                <thead>
                  <tr>
                    <th className="cov-th-corner"/>
                    {teamPokes.map((p,j) => (
                      <th key={j} className="cov-th-col">
                        <img src={p.sprite} width={24} height={24} style={{imageRendering:"pixelated",display:"block",margin:"0 auto"}}/>
                      </th>
                    ))}
                    <th className="cov-th-col" style={{background:"rgba(239,68,68,0.08)",minWidth:48}}>
                      <span style={{fontSize:8,color:"rgb(252,165,165)",fontWeight:700}}>NVE</span>
                    </th>
                    <th className="cov-th-col" style={{background:"rgba(74,222,128,0.08)",minWidth:48}}>
                      <span style={{fontSize:8,color:"rgb(74,222,128)",fontWeight:700}}>SE</span>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  {ALL_TYPES.map(atkType => {
                    const effs = teamPokes.map(p => offEff(atkType, p.types));
                    const nve = effs.filter(e => e > 0 && e < 1).length;
                    const se  = effs.filter(e => e >= 2).length;
                    const col = TYPE_COLORS[atkType] || "#6b7280";
                    return (
                      <tr key={atkType}>
                        <th className="cov-th-row">
                          <span className="type-pill-sm" style={{background:`${col}33`,border:`1px solid ${col}66`,color:col}}>{atkType}</span>
                        </th>
                        {effs.map((eff, j) => (
                          <td key={j} className={`cov-cell ${effClass(eff)}`}>
                            {eff !== 1 ? effLabel(eff) : ""}
                          </td>
                        ))}
                        <td className={`cov-summary-cell ${nve>0?"bad":""}`}>{nve||""}</td>
                        <td className={`cov-summary-cell ${se>0?"good":""}`}>{se||""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Defensive Coverage */}
          <div className="typecalc-section">
            <div className="typecalc-section-title def">🛡 Defensive Coverage</div>
            <div style={{overflowX:"auto"}}>
              <table className="cov-table">
                <thead>
                  <tr>
                    <th className="cov-th-corner"/>
                    {teamPokes.map((p,j) => (
                      <th key={j} className="cov-th-col">
                        <img src={p.sprite} width={24} height={24} style={{imageRendering:"pixelated",display:"block",margin:"0 auto"}}/>
                      </th>
                    ))}
                    <th className="cov-th-col" style={{background:"rgba(252,165,165,0.08)",minWidth:48}}>
                      <span style={{fontSize:8,color:"rgb(252,165,165)",fontWeight:700}}>Weak</span>
                    </th>
                    <th className="cov-th-col" style={{background:"rgba(74,222,128,0.08)",minWidth:48}}>
                      <span style={{fontSize:8,color:"rgb(74,222,128)",fontWeight:700}}>Resist</span>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  {ALL_TYPES.map(atkType => {
                    const effs = teamPokes.map(p => getTypeEff(atkType, p.types));
                    const weak   = effs.filter(e => e >= 2).length;
                    const resist = effs.filter(e => e > 0 && e < 1).length;
                    const col = TYPE_COLORS[atkType] || "#6b7280";
                    return (
                      <tr key={atkType}>
                        <th className="cov-th-row">
                          <span className="type-pill-sm" style={{background:`${col}33`,border:`1px solid ${col}66`,color:col}}>{atkType}</span>
                        </th>
                        {effs.map((eff, j) => (
                          <td key={j} className={`cov-cell ${effClass(eff)}`}>
                            {eff !== 1 ? effLabel(eff) : ""}
                          </td>
                        ))}
                        <td className={`cov-summary-cell ${weak>0?"bad":""}`}>{weak||""}</td>
                        <td className={`cov-summary-cell ${resist>0?"good":""}`}>{resist||""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  );

// ── useSavedTeams hook (localStorage) ────────────────────────────────────────
function useSavedTeams() {
  const [saved, setSaved] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem("boffmedia_saved_teams") || "[]"); }
    catch { return []; }
  });
  function persist(next) {
    setSaved(next);
    try { localStorage.setItem("boffmedia_saved_teams", JSON.stringify(next)); } catch {}
  }
  function saveTeam(name, pokeList) {
    const entry = { id: Date.now(), name, pokeList, savedAt: new Date().toISOString() };
    persist([...saved, entry]);
  }
  function deleteTeam(id) { persist(saved.filter(e => e.id !== id)); }
  function renameTeam(id, name) { persist(saved.map(e => e.id===id ? {...e,name} : e)); }
  return { saved, saveTeam, deleteTeam, renameTeam };
}

// ── PokéPaste exporter ────────────────────────────────────────────────────────
function pokesToPaste(pokeList) {
  return pokeList.map(poke => {
    const lines = [];
    const itemStr = poke.item && poke.item !== "None" ? ` @ ${poke.item}` : "";
    lines.push(`${poke.name}${itemStr}`);
    if (poke.ability && poke.ability !== "None") lines.push(`Ability: ${poke.ability}`);
    if (poke.level !== 100) lines.push(`Level: ${poke.level}`);
    if (poke.teraType && poke.teraType !== "None") lines.push(`Tera Type: ${poke.teraType}`);
    const evParts = [
      poke.evs.hp  ? `${poke.evs.hp} HP`  : "",
      poke.evs.atk ? `${poke.evs.atk} Atk` : "",
      poke.evs.def ? `${poke.evs.def} Def` : "",
      poke.evs.spa ? `${poke.evs.spa} SpA` : "",
      poke.evs.spd ? `${poke.evs.spd} SpD` : "",
      poke.evs.spe ? `${poke.evs.spe} Spe` : "",
    ].filter(Boolean);
    if (evParts.length) lines.push(`EVs: ${evParts.join(" / ")}`);
    if (poke.nature) lines.push(`${poke.nature} Nature`);
    const ivParts = [
      poke.ivs.hp  < 31 ? `${poke.ivs.hp} HP`  : "",
      poke.ivs.atk < 31 ? `${poke.ivs.atk} Atk` : "",
      poke.ivs.def < 31 ? `${poke.ivs.def} Def` : "",
      poke.ivs.spa < 31 ? `${poke.ivs.spa} SpA` : "",
      poke.ivs.spd < 31 ? `${poke.ivs.spd} SpD` : "",
      poke.ivs.spe < 31 ? `${poke.ivs.spe} Spe` : "",
    ].filter(Boolean);
    if (ivParts.length) lines.push(`IVs: ${ivParts.join(" / ")}`);
    poke.moves.filter(m => m.key).forEach(m => lines.push(`- ${m.key}`));
    return lines.join("\n");
  }).join("\n\n");
}

// ── SavedTeamsPanel ───────────────────────────────────────────────────────────
function SavedTeamsPanel({ open, onClose, saved, saveTeam, deleteTeam, renameTeam, currentTeam, currentMany, onLoadTeam, onLoadMany }) {
  const [saveName, setSaveName] = React.useState("");
  const [saveMode, setSaveMode] = React.useState(null);
  const [editingId, setEditingId] = React.useState(null);
  const [editName, setEditName] = React.useState("");
  const [exportText, setExportText] = React.useState(null);
  const [importModal, setImportModal] = React.useState(false);
  const [copiedId, setCopiedId] = React.useState(null);

  function doSave() {
    if (!saveName.trim()) return;
    const list = saveMode === "team" ? currentTeam : currentMany;
    saveTeam(saveName.trim(), list);
    setSaveName(""); setSaveMode(null);
  }

  function copyText(text, id) {
    navigator.clipboard?.writeText(text).catch(() => {});
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 1500);
  }

  return (
    <>
      <div className={`saved-panel ${open?"open":""}`}>
        <div className="saved-panel-header">
          <span className="saved-panel-title">💾 Equipos Guardados</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="saved-btn" style={{flex:"none",padding:"3px 9px",fontSize:10}}
              onClick={() => setImportModal(true)}>📋 Importar</button>
            <button className="drawer-close" onClick={onClose}>✕</button>
          </div>
        </div>
        <div className="saved-panel-body">
          <div style={{display:"flex",gap:4,marginBottom:4}}>
            <button className="saved-btn"
              style={saveMode==="team"?{borderColor:"rgba(249,115,22,0.5)",color:"rgb(251,146,60)"}:{}}
              onClick={()=>setSaveMode(saveMode==="team"?null:"team")}>+ Guardar Equipo</button>
            <button className="saved-btn"
              style={saveMode==="many"?{borderColor:"rgba(249,115,22,0.5)",color:"rgb(251,146,60)"}:{}}
              onClick={()=>setSaveMode(saveMode==="many"?null:"many")}>+ Guardar Rivales</button>
          </div>
          {saveMode && (
            <div style={{display:"flex",gap:4,marginBottom:4}}>
              <input className="form-input" style={{flex:1,fontSize:11,padding:"5px 8px"}}
                placeholder={`Nombre del ${saveMode==="team"?"equipo":"grupo"}...`}
                value={saveName} onChange={e=>setSaveName(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&doSave()} autoFocus/>
              <button className="paste-btn-import" style={{padding:"5px 12px",fontSize:11}} onClick={doSave}>
                Guardar
              </button>
            </div>
          )}

          {saved.length === 0 && (
            <div style={{fontSize:11,color:"rgb(71,85,105)",textAlign:"center",padding:"20px 0"}}>
              No hay equipos guardados aún.<br/>Usa los botones de arriba para guardar.
            </div>
          )}

          {saved.map(entry => {
            const pdata = entry.pokeList.map(p => POKEMON_DATA[p.name]).filter(Boolean);
            const pasteText = pokesToPaste(entry.pokeList);
            return (
              <div key={entry.id} className="saved-entry">
                {editingId === entry.id ? (
                  <div style={{display:"flex",gap:4}}>
                    <input className="form-input" style={{flex:1,fontSize:11,padding:"4px 6px"}}
                      value={editName} onChange={e=>setEditName(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"){renameTeam(entry.id,editName);setEditingId(null);}}}
                      autoFocus/>
                    <button className="paste-btn-import" style={{padding:"4px 10px",fontSize:10}}
                      onClick={()=>{renameTeam(entry.id,editName);setEditingId(null);}}>OK</button>
                  </div>
                ) : (
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div className="saved-entry-name" style={{flex:1}}>{entry.name}</div>
                    <span style={{fontSize:9,color:"rgb(71,85,105)"}}>{entry.pokeList.length}P</span>
                  </div>
                )}
                <div className="saved-entry-sprites">
                  {pdata.map((pd,i) => (
                    <img key={i} src={pd.sprite} width={28} height={28}
                      style={{imageRendering:"pixelated"}} title={entry.pokeList[i]?.name}/>
                  ))}
                </div>
                <div className="saved-entry-btns">
                  <button className="saved-btn" onClick={()=>onLoadTeam(entry.pokeList)}>→ Equipo</button>
                  <button className="saved-btn" onClick={()=>onLoadMany(entry.pokeList)}>→ Rivales</button>
                  <button className="saved-btn"
                    style={copiedId===entry.id?{borderColor:"rgba(74,222,128,0.5)",color:"rgb(74,222,128)"}:{}}
                    onClick={()=>copyText(pasteText, entry.id)}>
                    {copiedId===entry.id?"✓ Copiado":"📋 Copiar"}
                  </button>
                  <button className="saved-btn" onClick={()=>setExportText(pasteText)}>👁 Ver</button>
                  <button className="saved-btn" onClick={()=>{setEditingId(entry.id);setEditName(entry.name);}}>✎</button>
                  <button className="saved-btn danger" onClick={()=>deleteTeam(entry.id)}>✕</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Export view modal */}
      {exportText && (
        <div className="paste-modal-overlay" onClick={()=>setExportText(null)}>
          <div className="paste-modal" onClick={e=>e.stopPropagation()}>
            <div className="paste-modal-title">📋 Exportar PokéPaste</div>
            <textarea className="paste-modal-textarea" readOnly value={exportText}
              style={{minHeight:240}} onFocus={e=>e.target.select()}/>
            <div className="paste-modal-btns">
              <button className="paste-btn-cancel" onClick={()=>setExportText(null)}>Cerrar</button>
              <button className="paste-btn-import" onClick={()=>copyText(exportText,"modal")}>
                {copiedId==="modal"?"✓ Copiado!":"📋 Copiar al portapapeles"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Import from paste → save directly */}
      {importModal && (
        <PasteImportModal
          maxSlots={12}
          onImport={parsed => {
            const name = parsed[0]?.name
              ? `${parsed[0].name}${parsed.length>1?` +${parsed.length-1}`:""}`
              : "Importado";
            saveTeam(name, parsed);
          }}
          onClose={() => setImportModal(false)}
        />
      )}
    </>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("1v1"); // "1v1" | "teamvsmany" | "manyvsteam" | "speed"
  const [savedPanelOpen, setSavedPanelOpen] = useState(false);
  const { saved, saveTeam, deleteTeam, renameTeam } = useSavedTeams();

  // 1v1 Pokémon
  const [poke1, setPoke1Raw] = useState(mkDefaultPoke("Abomasnow"));
  const [poke2, setPoke2Raw] = useState(mkDefaultPoke("Abomasnow"));

  // Shared field
  const [field, setFieldRaw] = useState({
    format:"Singles", level:100, weather:"None", terrain:"None",
    p1StealthRock:false, p1Spikes:0, p1Reflect:false, p1LightScreen:false, p1AuroraVeil:false, p1Protect:false, p1LeechSeed:false,
    p2StealthRock:false, p2Spikes:0, p2Reflect:false, p2LightScreen:false, p2AuroraVeil:false, p2Protect:false, p2LeechSeed:false,
    gravity:false, magicRoom:false, wonderRoom:false, trickRoom:false,
  });

  // Shared team (seeds from poke1/poke2 in 1v1)
  const [team, setTeam] = useState(() => [mkDefaultPoke("Abomasnow"), mkDefaultPoke("Abomasnow")]);
  const [many, setMany] = useState(() => [mkDefaultPoke("Abomasnow"), mkDefaultPoke("Abomasnow")]);

  // Independent active move selections for 1v1
  const [activeP1, setActiveP1] = useState(0);
  const [activeP2, setActiveP2] = useState(0);

  const setPoke1 = patch => setPoke1Raw(p => ({...p,...patch}));
  const setPoke2 = patch => setPoke2Raw(p => ({...p,...patch}));
  const setField  = patch => setFieldRaw(f => ({...f,...patch}));

  // Sync poke1/poke2 into team slots 0/1 when switching away from 1v1
  const handleTabChange = (newTab) => {
    if (tab === "1v1" && newTab !== "1v1") {
      setTeam(t => {
        const next = [...t];
        next[0] = {...poke1};
        if (next.length > 1) next[1] = {...poke2};
        return next;
      });
    }
    setTab(newTab);
  };

  // Compute results for 1v1
  const results1 = useComputeResults(poke1, poke2, field);
  const results2 = useComputeResults(poke2, poke1, field);

  const TABS = [
    { id:"1v1",        label:"1 vs 1" },
    { id:"teamvsmany", label:"Equipo → Muchos" },
    { id:"manyvsteam", label:"Muchos → Equipo" },
    { id:"speed",      label:"⚡ Velocidad" },
    { id:"typecalc",   label:"🔮 Tipos" },
  ];

  return (
    <div className="app">
      {/* Nav */}
      <nav className="nav">
        <div className="nav-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="5" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" strokeWidth="1"/>
            <circle cx="12" cy="12" r="6" stroke="rgb(249,115,22)" strokeWidth="1.5" fill="none"/>
            <line x1="6" y1="12" x2="18" y2="12" stroke="rgb(249,115,22)" strokeWidth="1.5"/>
            <circle cx="12" cy="12" r="2" fill="rgb(249,115,22)"/>
          </svg>
          <span className="nav-logo-text">BoffMedia</span>
          <span className="nav-beta">BETA</span>
        </div>

        {/* Mode tabs */}
        <div className="nav-tabs">
          {TABS.map(t => (
            <button key={t.id} className={`nav-tab ${tab===t.id?"active":""}`}
              onClick={() => handleTabChange(t.id)}
            >{t.label}</button>
          ))}
        </div>

        <div className="nav-right">
          <button className={`nav-save-btn ${savedPanelOpen?"active":""}`}
            onClick={() => setSavedPanelOpen(o => !o)}>
            💾 Guardados
            {saved.length > 0 && (
              <span style={{background:"rgba(249,115,22,0.3)",color:"rgb(251,146,60)",borderRadius:"9999px",fontSize:9,fontWeight:800,padding:"1px 5px",marginLeft:2}}>
                {saved.length}
              </span>
            )}
          </button>
          <span style={{fontSize:10,fontWeight:600,background:"rgb(30,41,59)",color:"rgb(148,163,184)",padding:"3px 7px",borderRadius:4}}>ES</span>
          <div className="nav-avatar">T</div>
          <span style={{fontSize:12,color:"rgb(203,213,225)"}}>Trainer</span>
        </div>
      </nav>

      {/* ── 1v1 mode ── */}
      {tab === "1v1" && (
        <>
          <MoveStrip
            poke1={poke1} poke2={poke2}
            activeP1={activeP1} setActiveP1={setActiveP1}
            activeP2={activeP2} setActiveP2={setActiveP2}
            result1={results1} result2={results2}
          />
          <div className="main-grid">
            <PokemonPanel poke={poke1} onChange={setPoke1} side="atk"/>
            <FieldPanel field={field} onChange={setField}/>
            <PokemonPanel poke={poke2} onChange={setPoke2} side="def"/>
          </div>
        </>
      )}

      {/* ── Team vs Many mode ── */}
      {tab === "teamvsmany" && (
        <TeamVsManyView
          team={team} setTeam={setTeam}
          many={many} setMany={setMany}
          field={field} onChange={setField}
        />
      )}

      {/* ── Many vs Team mode ── */}
      {tab === "manyvsteam" && (
        <ManyVsTeamView
          team={team} setTeam={setTeam}
          many={many} setMany={setMany}
          field={field} onChange={setField}
        />
      )}

      {/* ── Speed mode ── */}
      {tab === "speed" && (
        <SpeedView team={team} many={many}/>
      )}

      {/* ── Type Calc mode ── */}
      {tab === "typecalc" && (
        <TypeCalcView team={team}/>
      )}

      {/* ── Saved teams panel ── */}
      <SavedTeamsPanel
        open={savedPanelOpen}
        onClose={() => setSavedPanelOpen(false)}
        saved={saved}
        saveTeam={saveTeam}
        deleteTeam={deleteTeam}
        renameTeam={renameTeam}
        currentTeam={team}
        currentMany={many}
        onLoadTeam={pokeList => { setTeam(pokeList.slice(0,6)); setSavedPanelOpen(false); }}
        onLoadMany={pokeList => { setMany(pokeList.slice(0,12)); setSavedPanelOpen(false); }}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
