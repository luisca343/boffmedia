# Fallback local DB. To use: `docker compose -f docker-compose.agent.yml up -d`
# then set AGENT_DATABASE_URL=mysql://agent:agent_pass@127.0.0.1:3307/agent_memory in .env.agent

services:
  agent_db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: agent_root
      MYSQL_DATABASE: agent_memory
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent_pass
    ports:
      - "3307:3306"
    volumes:
      - agent_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_db_data:
