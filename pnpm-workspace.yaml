packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  path-to-regexp@>=0.2.0 <1.9.0: '>=1.9.0'
  tmp@<=0.2.3: '>=0.2.4'
  postcss@<7.0.36: '>=7.0.36'
  postcss@<8.4.31: '>=8.4.31'
  postcss@>=7.0.0 <7.0.36: '>=7.0.36'
  # React/Next pins for the web app. A non-root package's `pnpm.overrides` is
  # ignored by pnpm, so these must live here to take effect (see apps/web).
  next: 16.0.7
  react: 19.2.3
  react-dom: 19.2.3
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  # @pkmn/* pins for the battle sim. Moved here from the root package.json
  # `pnpm.overrides` (2026-07-18), which pnpm 10 silently ignores — the pins
  # were not taking effect there.
  '@pkmn/client': ^0.7.0
  '@pkmn/data': ^0.10.7
  '@pkmn/dex': ^0.9.38
  '@pkmn/img': ^0.2.40
  '@pkmn/login': ^0.2.0
  '@pkmn/protocol': ^0.7.0
  '@pkmn/randoms': ^0.9.38
  '@pkmn/sim': ^0.9.38
  '@pkmn/view': ^0.7.0

# Packages allowed to run install/build scripts. Moved here from the root
# package.json `pnpm.onlyBuiltDependencies` (2026-07-18), which pnpm 10 ignores.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - bufferutil
  - core-js
  - es5-ext
  - esbuild
  - necord
  - next-translate-plugin
  - protobufjs
  - sharp
  - unrs-resolver
  - utf-8-validate

packageExtensions:
  '@hookform/resolvers@*':
    peerDependencies:
      zod: '*'
