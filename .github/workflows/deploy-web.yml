name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/pack-schema/**'
      - 'packages/ui/**'
      - 'packages/tailwind-config/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set secrets
        working-directory: apps/web
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production.local
          echo "NEXT_PUBLIC_API=${{ secrets.NEXT_PUBLIC_API }}" >> .env.production.local
          echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env.production.local
          echo "NEXT_PUBLIC_MC_WORLD=${{ secrets.NEXT_PUBLIC_MC_WORLD }}" >> .env.production.local
          echo "NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}" >> .env.production.local
          echo "SECRET=${{ secrets.SECRET }}" >> .env.production.local
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.production.local
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.production.local
          echo "NEXT_PUBLIC_TWITCH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}" >> .env.production.local
          echo "NEXT_PUBLIC_TWITCH_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_SECRET }}" >> .env.production.local
          echo "NEXT_PUBLIC_TERAS_API=${{ secrets.NEXT_PUBLIC_TERAS_API }}" >> .env.production.local

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            luisca343/boffmedia-web2:latest
            luisca343/boffmedia-web2:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


