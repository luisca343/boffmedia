name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/pack-schema/**"
      - "packages/battle-core/**"
      - "packages/ui/**"
      # Every tool package apps/web transpiles and renders. Absent until
      # 2026-09-02, so a tool-only change shipped nothing until some other
      # path happened to trigger a deploy.
      - "packages/tools/**"
      - "packages/tailwind-config/**"
      - "release/version.json"
      - "changelog/fragments/**"
      - "release/plan.json"
      - "scripts/release-fragments.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  # Load-bearing for the web image specifically: next.config.mjs sets
  # typescript.ignoreBuildErrors, so the build below succeeds with real type
  # errors. This job is the only thing that fails on them.
  validate:
    uses: ./.github/workflows/validate.yml

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read canonical release identity
        id: release
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('release/version.json', 'utf8')).version")
          version_file_sha=$(sha256sum release/version.json | cut -d' ' -f1)
          build_id="web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_file_sha=$version_file_sha" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set secrets
        working-directory: apps/web
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production.local
          echo "NEXT_PUBLIC_API=${{ secrets.NEXT_PUBLIC_API }}" >> .env.production.local
          echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env.production.local
          echo "NEXT_PUBLIC_MC_WORLD=${{ secrets.NEXT_PUBLIC_MC_WORLD }}" >> .env.production.local
          echo "NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}" >> .env.production.local
          # NOT `SECRET`. That name was NextAuth v3's; this app is on v4, whose
          # secret is NEXTAUTH_SECRET — and `authOptions.secret` reads
          # `env.NEXTAUTH_SECRET` explicitly, so nothing has consulted a bare
          # SECRET since the migration. It was still being written here, which
          # made the production env look like it had two secrets and one of them
          # unused. Removed by scripts/check-env-example.mjs, which flagged it as
          # a name the deploy writes and no code reads.
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.production.local
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.production.local
          # Twitch: the browser only ever needs the client id (mewtwitch calls the
          # Helix API with a Client-Id header). The secret is server-only — the
          # OAuth link flow in app/api/twitch/* reads env.TWITCH_CLIENT_SECRET.
          # It was previously written as NEXT_PUBLIC_TWITCH_CLIENT_SECRET, which
          # nothing read (so the link flow was inert) and which Next would inline
          # into the browser bundle the moment anything did. The GitHub secret
          # still carries the old name; rename and rotate it when convenient.
          echo "NEXT_PUBLIC_TWITCH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}" >> .env.production.local
          echo "TWITCH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}" >> .env.production.local
          echo "TWITCH_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_SECRET }}" >> .env.production.local
          # Which database the admin console says it is about to mutate. Unset
          # falls back to NODE_ENV, which cannot tell staging from production —
          # so staging labels itself PROD. See admin/_components/ui/av-shell.tsx.
          echo "NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV || 'production' }}" >> .env.production.local
          # NEXT_PUBLIC_TERAS_API was written here and read by nothing, in any
          # app or package — a dead name inlined into every browser bundle. Same
          # class as the NEXT_PUBLIC_TWITCH_CLIENT_SECRET above, found the same
          # way, by scripts/check-env-example.mjs. The Minecraft-side token the
          # name suggests is TERAS_API_TOKEN and it lives API-side only.

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            luisca343/boffmedia-web2:latest
            luisca343/boffmedia-web2:${{ github.run_number }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            GIT_SHA=${{ steps.release.outputs.git_sha }}
            BUILD_ID=${{ steps.release.outputs.build_id }}
            VERSION_FILE_SHA=${{ steps.release.outputs.version_file_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The run flags live on the host (/opt/scripts/deploy.sh, from
      # scripts/deploy/deploy.sh in this repo), because volumes, env file and
      # ports are host facts. The script recreates the container and waits for
      # the image's HEALTHCHECK, rolling back to the previous tag if the new
      # one never reports healthy.
      #
      # Deploys :${{ github.run_number }}, never :latest — an immutable tag is
      # what makes the published tag a usable rollback target.
      #
      # SSH_PRIVATE_KEY must be stored BASE64 ENCODED: the step pipes it through
      # `base64 -d`, so a raw PEM decodes to garbage. StrictHostKeyChecking is
      # left ON so the ssh-keyscan above is not pointless.
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "/opt/scripts/deploy.sh web ${{ github.run_number }}"

      - name: Create or retry the fragment-backed release draft
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API || 'https://api.boffmedia.es' }}
          RELEASE_DEPLOYMENT_TOKEN: ${{ secrets.RELEASE_DEPLOYMENT_TOKEN }}
          SOURCE_COMMIT_SHA: ${{ steps.release.outputs.git_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_FILE_SHA: ${{ steps.release.outputs.version_file_sha }}
        run: |
          set -euo pipefail
          api_base="${API_BASE_URL%/}"
          [ -n "$RELEASE_DEPLOYMENT_TOKEN" ] || { echo "::error::RELEASE_DEPLOYMENT_TOKEN is not configured"; exit 1; }
          required_surfaces=$(node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('release/plan.json', 'utf8')).requiredSurfaces)")
          registered=$(curl --fail --silent --show-error "$api_base/releases/internal/fragments/registered" \
            -H "X-Release-Deployment-Token: $RELEASE_DEPLOYMENT_TOKEN")
          claimed=$(echo "$registered" | jq -c '.data.fragmentIds // []')
          available=$(RELEASE_SOURCE_COMMIT_SHA="$SOURCE_COMMIT_SHA" node scripts/release-fragments.mjs --json | \
            jq --argjson claimed "$claimed" '{fragments: [.fragments[] | select((.fragmentId as $id | ($claimed | index($id))) == null)]}')
          mode=$(echo "$available" | jq -r 'if (.fragments | length) > 0 then "entries" else "none" end')
          body=$(echo "$available" | jq \
            --arg version "$VERSION" \
            --argjson requiredSurfaces "$required_surfaces" \
            --arg changelogMode "$mode" \
            --arg sourceCommitSha "$SOURCE_COMMIT_SHA" \
            --arg versionFileSha "$VERSION_FILE_SHA" \
            '. + {version:$version, requiredSurfaces:$requiredSurfaces, changelogMode:$changelogMode, sourceCommitSha:$sourceCommitSha, versionFileSha:$versionFileSha}')
          draft=$(curl --fail --silent --show-error -X POST "$api_base/releases/internal/drafts" \
            -H 'Content-Type: application/json' \
            -H "X-Release-Deployment-Token: $RELEASE_DEPLOYMENT_TOKEN" \
            --data "$body")
          [ "$(echo "$draft" | jq -r '.success')" = "true" ] || { echo "::error::release draft was rejected: $draft"; exit 1; }
          echo "Release draft for $VERSION is available for approval."

      - name: Verify live web identity and record deployment
        shell: bash
        env:
          API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API || 'https://api.boffmedia.es' }}
          RELEASE_DEPLOYMENT_TOKEN: ${{ secrets.RELEASE_DEPLOYMENT_TOKEN }}
          WEB_BASE_URL: ${{ secrets.NEXT_PUBLIC_URL || 'https://boffmedia.es' }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_VERSION_FILE_SHA: ${{ steps.release.outputs.version_file_sha }}
          EXPECTED_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          EXPECTED_BUILD_ID: ${{ steps.release.outputs.build_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api_base="${API_BASE_URL%/}"
          web_base="${WEB_BASE_URL%/}"
          [ -n "$RELEASE_DEPLOYMENT_TOKEN" ] || { echo "::error::RELEASE_DEPLOYMENT_TOKEN is not configured"; exit 1; }

          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$web_base/" >/dev/null
          identity=$(curl --fail --silent --show-error --retry 10 --retry-delay 3 "$web_base/version")
          [ "$(echo "$identity" | jq -r '.success')" = "true" ] || { echo "::error::/version returned an invalid envelope: $identity"; exit 1; }
          [ "$(echo "$identity" | jq -r '.data.surface')" = "web" ] || { echo "::error::live web surface mismatch: $identity"; exit 1; }
          [ "$(echo "$identity" | jq -r '.data.version')" = "$EXPECTED_VERSION" ] || { echo "::error::live web version mismatch: $identity"; exit 1; }
          [ "$(echo "$identity" | jq -r '.data.gitSha')" = "$EXPECTED_GIT_SHA" ] || { echo "::error::live web git SHA mismatch: $identity"; exit 1; }
          [ "$(echo "$identity" | jq -r '.data.buildId')" = "$EXPECTED_BUILD_ID" ] || { echo "::error::live web build identity mismatch: $identity"; exit 1; }
          [ "$(echo "$identity" | jq -r '.data.versionFileSha')" = "$EXPECTED_VERSION_FILE_SHA" ] || { echo "::error::live web version manifest mismatch: $identity"; exit 1; }

          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          idempotency_key="production:web:web-${RUN_ID}-${RUN_ATTEMPT}"
          body=$(jq -n \
            --arg surface web \
            --arg environment production \
            --arg productVersion "$EXPECTED_VERSION" \
            --arg buildId "$EXPECTED_BUILD_ID" \
            --arg gitSha "$EXPECTED_GIT_SHA" \
            --arg versionFileSha "$EXPECTED_VERSION_FILE_SHA" \
            --arg healthCheckUrl "$web_base/version" \
            --arg healthCheckedAt "$checked_at" \
            --arg idempotencyKey "$idempotency_key" \
            '{surface:$surface, environment:$environment, productVersion:$productVersion, buildId:$buildId, gitSha:$gitSha, versionFileSha:$versionFileSha, status:"verified", healthCheckUrl:$healthCheckUrl, healthCheckedAt:$healthCheckedAt, idempotencyKey:$idempotencyKey}')
          recorded=$(curl --fail --silent --show-error -X POST "$api_base/releases/internal/deployments" \
            -H 'Content-Type: application/json' \
            -H "X-Release-Deployment-Token: $RELEASE_DEPLOYMENT_TOKEN" \
            --data "$body")
          [ "$(echo "$recorded" | jq -r '.success')" = "true" ] || { echo "::error::deployment evidence was rejected: $recorded"; exit 1; }
          echo "Recorded verified web deployment for $EXPECTED_VERSION ($EXPECTED_BUILD_ID)."
