name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/pack-schema/**'
      - 'packages/battle-core/**'
      - 'packages/ui/**'
      # Every tool package apps/web transpiles and renders. Absent until
      # 2026-09-02, so a tool-only change shipped nothing until some other
      # path happened to trigger a deploy.
      - 'packages/tools/**'
      - 'packages/tailwind-config/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  # Load-bearing for the web image specifically: next.config.mjs sets
  # typescript.ignoreBuildErrors, so the build below succeeds with real type
  # errors. This job is the only thing that fails on them.
  validate:
    uses: ./.github/workflows/validate.yml

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set secrets
        working-directory: apps/web
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production.local
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production.local
          echo "NEXT_PUBLIC_API=${{ secrets.NEXT_PUBLIC_API }}" >> .env.production.local
          echo "NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}" >> .env.production.local
          echo "NEXT_PUBLIC_MC_WORLD=${{ secrets.NEXT_PUBLIC_MC_WORLD }}" >> .env.production.local
          echo "NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}" >> .env.production.local
          # NOT `SECRET`. That name was NextAuth v3's; this app is on v4, whose
          # secret is NEXTAUTH_SECRET — and `authOptions.secret` reads
          # `env.NEXTAUTH_SECRET` explicitly, so nothing has consulted a bare
          # SECRET since the migration. It was still being written here, which
          # made the production env look like it had two secrets and one of them
          # unused. Removed by scripts/check-env-example.mjs, which flagged it as
          # a name the deploy writes and no code reads.
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.production.local
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.production.local
          # Twitch: the browser only ever needs the client id (mewtwitch calls the
          # Helix API with a Client-Id header). The secret is server-only — the
          # OAuth link flow in app/api/twitch/* reads env.TWITCH_CLIENT_SECRET.
          # It was previously written as NEXT_PUBLIC_TWITCH_CLIENT_SECRET, which
          # nothing read (so the link flow was inert) and which Next would inline
          # into the browser bundle the moment anything did. The GitHub secret
          # still carries the old name; rename and rotate it when convenient.
          echo "NEXT_PUBLIC_TWITCH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}" >> .env.production.local
          echo "TWITCH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}" >> .env.production.local
          echo "TWITCH_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_SECRET }}" >> .env.production.local
          # Which database the admin console says it is about to mutate. Unset
          # falls back to NODE_ENV, which cannot tell staging from production —
          # so staging labels itself PROD. See admin/_components/ui/av-shell.tsx.
          echo "NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV || 'production' }}" >> .env.production.local
          # NEXT_PUBLIC_TERAS_API was written here and read by nothing, in any
          # app or package — a dead name inlined into every browser bundle. Same
          # class as the NEXT_PUBLIC_TWITCH_CLIENT_SECRET above, found the same
          # way, by scripts/check-env-example.mjs. The Minecraft-side token the
          # name suggests is TERAS_API_TOKEN and it lives API-side only.

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            luisca343/boffmedia-web2:latest
            luisca343/boffmedia-web2:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The run flags live on the host (/opt/scripts/deploy.sh, from
      # scripts/deploy/deploy.sh in this repo), because volumes, env file and
      # ports are host facts. The script recreates the container and waits for
      # the image's HEALTHCHECK, rolling back to the previous tag if the new
      # one never reports healthy.
      #
      # Deploys :${{ github.run_number }}, never :latest — an immutable tag is
      # what makes the published tag a usable rollback target.
      #
      # SSH_PRIVATE_KEY must be stored BASE64 ENCODED: the step pipes it through
      # `base64 -d`, so a raw PEM decodes to garbage. StrictHostKeyChecking is
      # left ON so the ssh-keyscan above is not pointless.
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "/opt/scripts/deploy.sh web ${{ github.run_number }}"
