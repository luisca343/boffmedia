name: Docker Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}
      NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
      SECRET: ${{ secrets.SECRET }}
      NEXT_PUBLIC_MC_WORLD: ${{ secrets.NEXT_PUBLIC_MC_WORLD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{secrets.GOOGLE_CLIENT_ID}}" >> .env.production.local
          echo "GOOGLE_CLIENT_SECRET=${{secrets.GOOGLE_CLIENT_SECRET}}" >> .env.production.local
          echo "NEXT_PUBLIC_API=${{secrets.NEXT_PUBLIC_API}}" >> .env.production.local
          echo "NEXT_PUBLIC_SOCKET_URL=${{secrets.NEXT_PUBLIC_SOCKET_URL}}" >> .env.production.local
          echo "SECRET=${{secrets.SECRET}}" >> .env.production.local
          echo "NEXT_PUBLIC_MC_WORLD=${{secrets.NEXT_PUBLIC_MC_WORLD}}" >> .env.production.local

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            luisca343/boffmedia-web:latest
            luisca343/boffmedia-web:${{ github.run_number }}