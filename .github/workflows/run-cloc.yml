name: Run cloc reports

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  cloc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run cloc on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc jq
          chmod +x ./scripts/run-cloc.sh
          ./scripts/run-cloc.sh output
        shell: bash

      - name: Run cloc on Windows
        if: matrix.os == 'windows-latest'
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          choco install -y cloc || echo 'choco cloc failed'
          choco install -y jq || echo 'choco jq failed'
          ./scripts/run-cloc.ps1 output
        shell: pwsh

      - name: Upload cloc output
        uses: actions/upload-artifact@v4
        with:
          name: cloc-output-${{ github.run_id }}
          path: output
