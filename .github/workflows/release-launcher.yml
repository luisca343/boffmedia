name: Release Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> apps/launcher/src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The certificate is optional for preview releases. Production releases
      # should provide both secrets so SmartScreen sees a trusted publisher.
      - name: Import Windows certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/certificate.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/certificate.txt certificate/certificate.pfx
          Remove-Item certificate/certificate.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null

      - name: Configure Windows certificate
        if: ${{ env.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $path = "apps/launcher/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $env:WINDOWS_CERTIFICATE_THUMBPRINT -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Build and publish signed artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/launcher
          tagName: launcher-v__VERSION__
          releaseName: Boff Launcher v__VERSION__
          releaseBody: Instala esta versión para actualizar Boff Launcher.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
