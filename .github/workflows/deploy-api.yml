name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'packages/pack-schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  # Nothing here compiles what it ships — `nest build` is the only type-check in
  # the path and it runs inside the image build. Gate on the real checks first.
  validate:
    uses: ./.github/workflows/validate.yml

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            luisca343/boffmedia-server2:latest
            luisca343/boffmedia-server2:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The run flags live on the host (/opt/scripts/deploy.sh, from
      # scripts/deploy/deploy.sh in this repo), because volumes, env file and
      # ports are host facts. The script recreates the container and waits for
      # the image's HEALTHCHECK, rolling back to the previous tag if the new
      # one never reports healthy.
      #
      # Deploys :${{ github.run_number }}, never :latest — an immutable tag is
      # what makes the published tag a usable rollback target.
      #
      # SSH_PRIVATE_KEY must be stored BASE64 ENCODED: the step pipes it through
      # `base64 -d`, so a raw PEM decodes to garbage. StrictHostKeyChecking is
      # left ON so the ssh-keyscan above is not pointless.
      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "/opt/scripts/deploy.sh api ${{ github.run_number }}"
