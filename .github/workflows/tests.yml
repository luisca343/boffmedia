name: Tests

# The test suites that exist in this repo but were never wired to CI: vitest
# across apps/web + the packages, `cargo test` for the Tauri crate, and the
# Playwright e2e project.
#
# NOT here on purpose:
#
#  - `pnpm --filter api test` (2900+ jest tests). It already runs in
#    validate.yml, which is the gate BOTH deploy workflows call. Duplicating it
#    would add ~3 min to every PR for a suite that is already blocking.
#  - Anything that would end up in front of a deploy. validate.yml is reused via
#    `workflow_call`, so a job added there gates every API and web release —
#    a 10-minute Windows runner compiling Rust has no business blocking an API
#    image that contains no Rust. These suites gate the PR, not the ship.
#
# Node 22.12 is the floor (root package.json `engines`), not 22: `require(esm)`
# landed there, and below it jsdom's html-encoding-sniffer chain throws
# ERR_REQUIRE_ESM and the tools-minecraft DOM tests cannot start at all.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per runtime, and the steps inside it run one package at a time.
  # That is the same discipline scripts/typecheck-sequential.js and
  # scripts/lint-sequential.js encode: these packages are checked serially
  # because running them together OOMs. A step per package also means a failure
  # names itself in the run summary instead of hiding in a merged log.
  vitest:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not --frozen-lockfile, for the reason validate.yml documents: the API
      # image installs with --no-frozen-lockfile, and a gate stricter than the
      # thing it gates fails on drift that would have deployed fine.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # `web`'s `test` script is Playwright, not vitest — the unit suite is
      # `test:unit`. Running `pnpm -r test` here would launch a browser project
      # in this job by accident.
      - name: web (unit)
        run: pnpm --filter web test:unit

      - name: battle-core
        run: pnpm --filter @boffmedia/battle-core test

      # Half of the pack-manifest parity harness: this step runs the shared
      # fixtures through zod, the `cargo test` job below runs the SAME files
      # through `parse_manifest`. Neither half is meaningful alone — a rule that
      # exists on one side only shows up as a fixture one job rejects and the
      # other accepts. Both jobs are required checks for that reason; dropping
      # either silently restores the drift this was built to catch.
      - name: pack-schema
        run: pnpm --filter @boffmedia/pack-schema test

      # Three exporter suites read multi-MB game exports from docs/schem/, which
      # .gitignore excludes. They skip themselves here — see schem-fixtures.ts.
      - name: tools-minecraft
        run: pnpm --filter @boffmedia/tools-minecraft test

      - name: tools-battlesim
        run: pnpm --filter @boffmedia/tools-battlesim test

      # The four packages whose suites landed with the tool-coverage pass. They
      # are listed one step per package for the same reason as the rest, and
      # they are listed AT ALL because a suite absent from this file is a suite
      # that only ever runs on the machine that wrote it. scripts/check-ci-coverage.mjs
      # now fails the lint chain if a test-bearing package goes missing here.
      - name: tool-kit
        run: pnpm --filter @boffmedia/tool-kit test

      - name: tools-pokemon
        run: pnpm --filter @boffmedia/tools-pokemon test

      - name: tools-misc
        run: pnpm --filter @boffmedia/tools-misc test

      - name: tools-mhwilds
        run: pnpm --filter @boffmedia/tools-mhwilds test

      - name: desktop (renderer)
        run: pnpm --filter desktop test

  # windows-latest, not ubuntu: WebView2 is what users run, and building the
  # shell against WebKitGTK is the flaky path this repo already decided against
  # (CLAUDE.md, and desktop-release.yml builds on Windows for the same reason).
  #
  # No `pnpm install` and no renderer build: build.rs generates the pack types
  # from the COMMITTED schema/pack-manifest.schema.json, and tauri_build only
  # emits a rerun-if-changed for frontendDist when the directory exists — so
  # `cargo test` compiles from a bare checkout with no Node in the picture.
  # Verified against a checkout with apps/desktop/dist absent.
  #
  # This job is also the Rust half of the pack-manifest parity harness (see the
  # pack-schema step above). `pack::parity` reads the fixture JSON straight off
  # the checkout at packages/pack-schema/src/__fixtures__/parity — committed
  # files, no Node and no build needed to get at them.
  cargo:
    name: Unit tests (cargo)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # X12. desktop-release.yml is manual and Windows-only, so before this a
      # Rust mistake surfaced at release time, twenty minutes into a build. The
      # `cargo test` step above already covers "does it compile"; this covers
      # the rest. `--all-targets` so the test modules are linted too — that is
      # where half the findings were.
      #
      # `-D warnings` is the point: a clippy run that only prints is a clippy
      # run nobody reads. The 17 findings this started with are fixed at the
      # source, except two that are deliberate and carry a scoped
      # `#[allow(...)]` with a comment saying why (an 8-argument game-agnostic
      # signature, and BPS action encoding written out as `(n - 1) << 2 | cmd`
      # so the command number stays legible). Never widen those to a crate-level
      # allow.
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Integration tests: MySQL with Testcontainers.
  # These run against a REAL database (not fakes), so they verify behaviors
  # fakes cannot model: unique-key collisions, FK constraints, migrations,
  # and soft-delete with PII scrubbing.
  #
  # BLOCKING, deliberately. The suite decides at load time whether a Docker
  # endpoint exists and reports itself skipped when there is none, so a runner
  # without Docker is already a pass — `continue-on-error` here would only hide
  # a genuine failure, which is the entire thing this job exists to catch.
  #
  # No docker-in-docker service either: ubuntu-latest ships a working daemon and
  # testcontainers talks to it directly.
  integration:
    name: Integration tests (MySQL + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: API integration tests (MySQL)
        run: pnpm --filter api test:integration

  # B7. The battle simulator, driven in a real browser against a real bundle.
  #
  # BLOCKING, unlike the Playwright job below, and the difference is the whole
  # reason this is a separate job: that one needs a deployed site and real
  # accounts, while this one needs nothing. The suite drives a LOCAL AI battle,
  # which runs the engine in a Web Worker inside the page — no relay, no API, no
  # network, no secrets. So it can be required, and it is.
  #
  # What it buys: before this, "bundling, worker and Next integration
  # regressions are invisible" was literally true — the package had 259 unit
  # tests and nothing that ran it as a program. A lazy chunk that fails to
  # resolve, a worker that cannot boot, a CJS-only workspace dependency that
  # explodes at module evaluation (which is exactly what building this found)
  # are all silent to vitest and fatal to a player.
  #
  # Playwright's `webServer` starts the Vite host itself; there is no separate
  # server step to keep in sync.
  battlesim-e2e:
    name: E2E (battlesim, local AI path)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the battlesim e2e suite
        run: pnpm --filter @boffmedia/tools-battlesim e2e

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlesim-e2e-report
          path: packages/tools/battlesim/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # NON-BLOCKING, and it has to be: every suite here needs a running site plus
  # real accounts. The `chromium` project hits public pages, `chromium:auth`
  # logs in as a player, and `chromium:admin` FAILS BY DESIGN unless its account
  # actually carries ROTOM_ADMIN — that hard failure is the whole point of the
  # project, so it must not be able to turn a PR red until the credentials are
  # genuinely in place.
  #
  # To make this blocking, set these repository secrets and delete the
  # `continue-on-error` line below:
  #   BASE_URL              — the deployed environment to test (playwright.config.ts
  #                           otherwise defaults to https://ficuslab.es)
  #   NEXT_PUBLIC_API       — the API that environment talks to
  #   NEXT_PUBLIC_MC_WORLD  — the Minecraft world the SmartRotom specs assert against
  #   TEST_USERNAME / TEST_PASSWORD              — an ordinary player account
  #   TEST_ADMIN_USERNAME / TEST_ADMIN_PASSWORD  — an account holding ROTOM_ADMIN
  # None of them are invented here: those are the names tests/auth.setup.ts,
  # tests/admin.setup.ts and playwright.config.ts already read.
  e2e:
    name: E2E (Playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Says out loud which half of the matrix can actually run, so a green tick
      # here is never mistaken for "the authenticated suites passed".
      - name: Report which credentials are present
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
        run: |
          [ -n "$TEST_USERNAME" ] \
            && echo "player credentials: present" \
            || echo "::warning::TEST_USERNAME is unset — the .auth.spec.ts suites will not run."
          [ -n "$TEST_ADMIN_USERNAME" ] \
            && echo "admin credentials: present" \
            || echo "::warning::TEST_ADMIN_USERNAME is unset — the .admin.spec.ts suites will fail by design."

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: apps/web
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_API: ${{ secrets.NEXT_PUBLIC_API }}
          NEXT_PUBLIC_MC_WORLD: ${{ secrets.NEXT_PUBLIC_MC_WORLD }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
