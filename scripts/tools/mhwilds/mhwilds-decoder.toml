# Minimal RE_RSZ configuration used by decode-mhwilds-bestiary.mjs.
# The decoder itself remains a local third-party tool under laboon/.

[tools]
msg = "tools/REMSG_Converter/REMSG_Converter.exe"
rsz_layouts = "rszmhwilds.json"

[io]
data = [
    "data/natives",
]
output = "output/"

[user]
input_prefix = "STM/GameDesign"

[[user.targets]]
output_prefix = "monsters/"
files = [
    "Common/Enemy/EnemyData.user.3",
    "Common/Enemy/EnemyPartsTypeData.user.3",
    "Enemy/CommonData/EnumMaker/EmID.user.3",
]

[[user.targets.transform]]
match = "EmID.user.3$"
rsz = [0]

[[user.targets]]
output_prefix = "monsters/parts"
files = [
    "Enemy/Em*/*/Data/Em*_Param_Parts.user.3",
    "Enemy/Em*/*/Data/Em*_Param_PartsBreakReward.user.3",
]

# Small monsters do not have anatomy reports, but their game-owned carve and
# reward rows are stored beside EnemyData under Common/Enemy. The normalizer
# joins these rows to EmID/EnemyData and publishes them as drop-only entries.
[[user.targets]]
output_prefix = "monsters/rewards"
files = [
    "Common/Enemy/Em*_*_*.user.3",
]

[[user.targets]]
output_prefix = "monsters/report"
files = [
    "Common/Enemy/EnemyReportAnatomyPartsBreakData.user.3",
    "Common/Enemy/EnemyReportAnatomyPartsRewardData.user.3",
    "Common/Enemy/EnemyReportBossData.user.3",
    "Common/Enemy/EnemyReportBossMaterialDispData.user.3",
    "Common/Enemy/EnemyReportBossReleaseData.user.3",
    "Common/Enemy/EnemyReportBossTitleData.user.3",
    "Common/Enemy/EnemyReportMeatDisplayData.user.3",
    "Common/Enemy/EnemyReportPartsBreakTypeData.user.3",
    "GUI/Common/_UserData/EnemyReportBossAnatomyTextureData.user.3",
]

[[user.targets]]
output_prefix = "monsters/"
files = [
    "Enemy/CommonData/Data/EnemyWeakAttrData.user.3",
]

# Keep the game-owned weapon/tree tables in the decoder output as well for the
# local catalog extraction/merge workflow; the bestiary normalizer ignores
# this additional output.
[[user.targets]]
output_prefix = "weapons/"
files = [
    "Common/Equip/RodInsectRecipeData.user.3",
    "Common/Equip/WeaponSeriesData.user.3",
    "Common/Weapon/*.user.3",
    "Player/ActionData/Wp05/UserData/*.user.3",
    "Player/EnumMaker/WeaponSeries.user.3",
    "Player/EnumMaker/Weapon/*.user.3",
]

[[user.targets.transform]]
match = "(?i)Tree.user.3$"
rsz = [2, 4]

[[user.targets.transform]]
match = "(?i)WeaponSeries.user.3$"
rsz = [0]

# Element/status ids and the game's status UI metadata. The UI glyphs are
# backed by the extracted icon font/atlas selected by the asset extractor;
# keeping the decoded tables gives the app a stable provenance trail without
# coupling runtime presentation to game-owned binary data.
[[user.targets]]
output_prefix = "attributes/"
files = [
    "Common/Enemy/EnemyReportWeaponAttributeData.user.3",
    "GUI/GUI080000/GUI080000/_UserData/StatusUIData.user.3",
]

# Equipment thumbnail joins. These game-owned lookup tables are authoritative;
# thumbnail filenames are implementation details and cannot be joined safely
# from localized names or armor model ids.
[[user.targets]]
output_prefix = "gear/"
files = [
    "Common/Equip/ArmorSeriesData.user.3",
    "GUI/Common/_UserData/ArmorThumbnailTextureData.user.3",
    "GUI/Common/_UserData/OtherThumbnailTextureData.user.3",
    "GUI/Common/_UserData/WeaponThumbnailTextureData.user.3",
]

# ArmorSeriesData only identifies the visual model.  The catalog package
# table is the authoritative model/slot join (and includes both body types).
# Keep the catalog glob broad: title updates add folders such as 04_10 without
# necessarily updating the public release list at the same time. The rsz
# transform unwraps the male/female root arrays emitted by the community
# decoder.
[[user.targets]]
output_prefix = "gear/"
files = [
    "Catalog/*/Data/PlayerArmorList*.user.3",
]

[[user.targets.transform]]
match = "PlayerArmorList(?:_[^/]+)?[.]user[.]3$"
rsz = [0, 1]

# A few collab/special armors do not render from ArmorSeriesData's model id.
# PlayerArmorVisualSetting_<id> maps the catalog ArmorID to the visual-parts
# number used by the character thumbnail prefab. Keep these tables in the
# decoded provenance tree so the asset builder can apply an explicit visual
# namespace join instead of guessing from a numeric id.
[[user.targets]]
output_prefix = "gear/visual/"
files = [
  "Equip/_Prefab/Armor/ArmorVisualSetting/PlayerArmorVisualSetting*.user.3",
]

[[user.targets.transform]]
match = "PlayerArmorVisualSetting(?:_[^/]+)?[.]user[.]3$"
rsz = [0]

[msg]
input_prefix = "STM/GameDesign/Text"

[[msg.targets]]
files = [
    "Excel_Data/EnemyPartsTypeName.msg.23",
    "Excel_Data/EnemyReportPartsBreakTypeName.msg.23",
    "Excel_Data/EnemyReportWeaponAttributeText.msg.23",
    "Excel_Data/EnemySpeciesName.msg.23",
    "Excel_Data/EnemyText.msg.23",
    "Reference/RefStatus.msg.23",
]

[[msg.targets]]
files = [
    "Excel_Equip/Bow.msg.23",
    "Excel_Equip/ChargeAxe.msg.23",
    "Excel_Equip/GunLance.msg.23",
    "Excel_Equip/Hammer.msg.23",
    "Excel_Equip/HeavyBowgun.msg.23",
    "Excel_Equip/Lance.msg.23",
    "Excel_Equip/LightBowgun.msg.23",
    "Excel_Equip/LongSword.msg.23",
    "Excel_Equip/Rod.msg.23",
    "Excel_Equip/RodInsect.msg.23",
    "Excel_Equip/ShortSword.msg.23",
    "Excel_Equip/SlashAxe.msg.23",
    "Excel_Equip/Tachi.msg.23",
    "Excel_Equip/TwinSword.msg.23",
    "Excel_Equip/WeaponSeries.msg.23",
    "Excel_Equip/Whistle.msg.23",
    "Excel_Action/HibikiDataText_Wp05.msg.23",
    "Excel_Action/HighFreqDataText_Wp05.msg.23",
    "Excel_Action/MusicSkillDataText_Wp05.msg.23",
]
