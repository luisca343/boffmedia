stages:
  - validate
  - build
  - deploy


# ── Shared templates ──────────────────────────────────────────────────────────

.docker_build:
  stage: build
  image: docker:27
  tags:
    - docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

.ssh_deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Support both File-type and Variable-type SSH_PRIVATE_KEY
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/deploy_key
      else
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
      fi
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  only:
    - tags


# ── Validate ──────────────────────────────────────────────────────────────────

lint-typecheck:
  stage: validate
  image: node:20-alpine
  tags:
    - docker
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install -g pnpm
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter api exec tsc --noEmit
    - pnpm --filter web exec tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG


# ── Build ─────────────────────────────────────────────────────────────────────

build-web:
  extends: .docker_build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - apps/web/**/*
        - packages/shared/**/*
        - public/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - |
      cat > apps/web/.env.production.local <<EOF
      GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
      NEXT_PUBLIC_API=$NEXT_PUBLIC_API
      NEXT_PUBLIC_SOCKET_URL=$NEXT_PUBLIC_SOCKET_URL
      NEXT_PUBLIC_MC_WORLD=$NEXT_PUBLIC_MC_WORLD
      NEXT_PUBLIC_URL=$NEXT_PUBLIC_URL
      SECRET=$SECRET
      NEXTAUTH_SECRET=$NEXTAUTH_SECRET
      NEXTAUTH_URL=$NEXTAUTH_URL
      NEXT_PUBLIC_TWITCH_CLIENT_ID=$NEXT_PUBLIC_TWITCH_CLIENT_ID
      NEXT_PUBLIC_TWITCH_CLIENT_SECRET=$NEXT_PUBLIC_TWITCH_CLIENT_SECRET
      EOF
    - |
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from luisca343/boffmedia-web2:latest \
        --file apps/web/Dockerfile \
        --tag luisca343/boffmedia-web2:latest \
        --tag luisca343/boffmedia-web2:$CI_PIPELINE_IID \
        .
    - docker push luisca343/boffmedia-web2:latest
    - docker push luisca343/boffmedia-web2:$CI_PIPELINE_IID

build-api:
  extends: .docker_build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - apps/api/**/*
        - packages/shared/**/*
        - public/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - |
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from luisca343/boffmedia-server2:latest \
        --file apps/api/Dockerfile \
        --tag luisca343/boffmedia-server2:latest \
        --tag luisca343/boffmedia-server2:$CI_PIPELINE_IID \
        .
    - docker push luisca343/boffmedia-server2:latest
    - docker push luisca343/boffmedia-server2:$CI_PIPELINE_IID


# ── Deploy (tag-triggered, Option B) ─────────────────────────────────────────

deploy-web:
  extends: .ssh_deploy
  needs:
    - build-web
  script:
    - |
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$DEPLOY_HOST \
        "docker pull luisca343/boffmedia-web2:latest && docker restart boffmedia-web"

deploy-api:
  extends: .ssh_deploy
  needs:
    - build-api
  script:
    - |
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$DEPLOY_HOST \
        "docker pull luisca343/boffmedia-server2:latest && docker restart boffmedia-server"
